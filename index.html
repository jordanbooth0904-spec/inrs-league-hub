/* Layout: broadcast timing-tower feel. Sticky brand bar + tab rail, one column on phones, two-column grids on wide screens. Single dark look by choice: black and white with 40XLI purple as an accent only. */
:root{

  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}

.brandlogo{height:76px;width:auto;display:block}
@media (max-width:480px){.brandlogo{height:58px}}
.mark{font:italic 900 28px/1 var(--display);letter-spacing:-.02em}
.series{font:italic 800 13px/1 var(--display);color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.switch{margin-left:auto;display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{font:800 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 9px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:focus-visible,.yearsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{flex:none}
.switch .yearsel{width:auto;flex:none;font:600 16px/1.1 var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;cursor:pointer}
.awresgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.awres{border:1px solid var(--line-2);border-radius:6px;padding:12px;background:var(--panel-2,rgba(255,255,255,.02));display:flex;flex-direction:column;gap:4px;min-height:96px}.awres.hid{justify-content:space-between;align-items:flex-start}.awres.awnext{border-color:var(--gold)}.awres.awnew{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);animation:awpop .6s ease-out}@keyframes awpop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){.awres.awnew{animation:none}}.awwin{font-size:18px;color:var(--gold)}.champ26{border-top:3px solid var(--gold);margin-bottom:16px}.champname{font:italic 900 clamp(30px,7vw,52px)/1 var(--display);text-transform:uppercase;margin:6px 0 0}.champname .dl{font:inherit;color:var(--gold)}.wrapcta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lapboards{display:grid;gap:0 20px;grid-template-columns:minmax(0,1fr)}@media(min-width:900px){.lapboards{grid-template-columns:repeat(2,minmax(0,1fr))}}.lapboard{max-height:min(420px,60vh);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;border:1px solid var(--line);border-radius:6px}@media(max-width:520px){.lapboard .lbset{display:none}.lapboard .tbl td,.lapboard .tbl th{padding-inline:6px}}.lapboard thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.farewell{border-left:3px solid var(--accent);margin-bottom:16px}.farewell h2{font-size:20px}details.legyr{border-top:1px solid var(--line);padding:8px 0}details.legyr:first-of-type{border-top:0}details.legyr summary{cursor:pointer;padding:4px 2px}details.legyr .scroll{margin-top:6px}

(function(){

  try{if(h.k!==S.sel&&S.idx)await selectSeason(h.k);S.view=VIEWS(h.v)?h.v:"home";applySub(h.sub);}finally{S.routing=false;}

    try{const r=await fetch(i.file,{cache:"no-store"});if(!r.ok)throw 0;S.arch[key]=duelFix(await r.json());}catch(e){S.selLoading=false;S.sel=MAINKEY;applySel();setHash(true);draw();toast("Couldn't load that season. Try again.");return;}
    if(S.sel!==key)return;S.selLoading=false;}

    '<select class="yearsel" data-change="season" aria-label="Season">'+years.map(x=>'<option value="'+esc(x.key)+'"'+(x.key===S.sel?" selected":"")+">"+x.year+(SER_FINAL[x.series]===+x.year?" (final)":"")+"</option>").join("")+"</select>";}

/* League dates are Eastern: show the day the race runs in Indiana, not the day it falls on in the viewer's time zone. */

  if(ms<=0)return ms>-4*3600e3?"<b>Race day</b> · green flag has dropped":"";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return"Green flag in <b>"+(d?d+"d ":"")+h+"h"+(d?"":" "+m+"m")+"</b>";}

/* ---------- stats ---------- */
function compute(){
  const st=settings(),P=st.points,races=sortedRaces();
  const done=races.filter(r=>r.status==="complete"&&Array.isArray(r.results)&&r.results.length&&!r.exhibition);
  const D={};S.drivers.forEach(d=>{D[d.id]={driver:d,starts:0,wins:0,top5:0,top10:0,poles:0,led:0,comp:0,inc:0,dnf:0,finSum:0,startSum:0,startN:0,best:null,racePts:0,penPts:0,total:0,log:[],racesLed:0}});
  const ptsFor=(row,maxLed)=>{if(typeof row.pts==="number"&&isFinite(row.pts))return row.pts;const f=int(row.fin);let p=f?num(P.table[f-1],0):0;const led=int(row.lapsLed)||0;
    if(led>0)p+=num(P.ledLap,0);if(maxLed>0&&led===maxLed)p+=num(P.mostLed,0);return p+num(row.bonus,0);};
  done.forEach(r=>{const maxLed=Math.max(0,...r.results.map(x=>int(x.lapsLed)||0));
    r.results.forEach(x=>{const s=D[x.driverId];if(!s)return;const f=int(x.fin),pts=ptsFor(x,maxLed),led=int(x.lapsLed)||0,inc=int(x.inc)||0,start=int(x.start);
      s.starts++;if(f===1)s.wins++;if(f&&f<=5)s.top5++;if(f&&f<=10)s.top10++;if(start===1)s.poles++;
      s.led+=led;if(led>0)s.racesLed++;s.comp+=int(x.lapsComp)||0;s.inc+=inc;if(isDnf(x.status))s.dnf++;
      if(f){s.finSum+=f;if(s.best===null||f<s.best)s.best=f;}if(start){s.startSum+=start;s.startN++;}
      s.racePts+=pts;s.log.push({race:r,fin:f,start,led,inc,status:x.status||"Running",pts,comp:int(x.lapsComp)});});});
  S.penalties.forEach(p=>{const s=D[p.driverId];if(s&&!p.included)s.penPts+=num(p.points,0);});
  Object.values(D).forEach(s=>{s.total=s.racePts-s.penPts;s.avgFin=s.starts?s.finSum/s.starts:null;s.avgStart=s.startN?s.startSum/s.startN:null;});
  const off=S.official&&Array.isArray(S.official.rows)&&S.official.rows.length?S.official:null;
  if(off)off.rows.forEach(o=>{const s=D[o.driverId];if(s){s.off=o;s.total=num(o.pts,0);s.starts=num(o.starts,s.starts);s.wins=num(o.wins,s.wins);s.top5=num(o.t5,s.top5);s.top10=num(o.t10,s.top10);s.poles=num(o.poles,s.poles);s.led=num(o.led,s.led);s.inc=num(o.inc,s.inc);}});
  const standings=Object.values(D).filter(s=>s.starts>0||s.off||s.driver.active!==false)
    .sort(off?((a,b)=>((a.off?a.off.pos:9999)-(b.off?b.off.pos:9999))||String(a.driver.name).localeCompare(String(b.driver.name)))
      :((a,b)=>(b.total-a.total)||(b.wins-a.wins)||((a.best||99)-(b.best||99))||(b.starts-a.starts)||String(a.driver.name).localeCompare(String(b.driver.name))));
  const rank={};let shown=0;standings.forEach(s=>{if(off){if(s.off)rank[s.driver.id]=s.off.pos;}else if(s.starts>0){shown++;rank[s.driver.id]=shown;}});
  const next=races.find(r=>r.status!=="complete")||null;
  const ran=Object.values(D).filter(s=>s.starts>0);
  const by=(f,cmp)=>ran.length?[...ran].sort(cmp||((a,b)=>f(b)-f(a)))[0]:null;
  const winners=new Set();done.forEach(r=>{const w=r.results.find(x=>int(x.fin)===1);if(w)winners.add(w.driverId);});
  const minStarts=Math.max(1,Math.ceil(done.length/2));
  const clean=ran.filter(s=>s.starts>=minStarts).sort((a,b)=>(a.inc/a.starts)-(b.inc/b.starts))[0]||null;
  const totalInc=done.reduce((t,r)=>t+r.results.reduce((u,x)=>u+(int(x.inc)||0),0),0),totalStarts=done.reduce((t,r)=>t+r.results.length,0);
  const league={run:races.filter(r=>r.status==="complete"&&(r.results||[]).length).length,total:races.length,avgDrv:totalStarts?totalInc/totalStarts:0,winners:winners.size,
    mostWins:by(s=>s.wins),mostLed:by(s=>s.led),clean,avgInc:done.length?totalInc/done.length:0};
  return{st,races,done,D,standings,rank,next,league,ptsFor,off};
}

    {k:"inc",l:"Inc",t:"incidents",n:1,v:s=>s.inc,r:s=>s.inc+"x"}];
  S.stdCols=cols;const rows=sortRows(base,cols,st);
  return'<section><div class="lt">Championship standings</div>'+hubBar()+'<div class="row" style="margin-bottom:8px"><span class="hint">Tap a column heading to sort. Tap again to reverse.</span>'+(st.key!=="pos"||st.dir!=="asc"?'<button class="btn sm ghost" data-act="sortreset" data-arg="std">Reset to points order</button>':"")+"</div>"+

    '</tbody></table></div></div><p class="hint">'+pointsSummary()+"</p></section>";};

function pointsSummary(){const P=settings().points,t=P.table;let lastI=t.length-1;while(lastI>0&&!num(t[lastI],0))lastI--;
  return"Points: 1st "+num(t[0],0)+(t[1]!==undefined?", 2nd "+num(t[1],0):"")+(t[2]!==undefined?", 3rd "+num(t[2],0):"")+(lastI>2?" … down to "+num(t[lastI],0)+" for "+(lastI+1)+"th":"")+
    (num(P.ledLap,0)?". +"+num(P.ledLap,0)+" for leading a lap":"")+(num(P.mostLed,0)?", +"+num(P.mostLed,0)+" for most laps led":"")+". Penalty points come off the total.";}

function resultsTable(r){const maxLed=Math.max(0,...r.results.map(x=>int(x.lapsLed)||0));const hasStage=r.results.some(x=>num(x.stage,0)),hasRating=r.results.some(x=>x.rating!=null);

    [...r.results].sort((a,b)=>a.fin-b.fin).map(x=>"<tr><td>"+posBadge(int(x.fin))+"</td><td>"+(x.car&&drv(x.driverId)&&String(drv(x.driverId).number)!==String(x.car)?'<span class="carno">#'+esc(x.car)+"</span> "+'<button class="dl" data-act="driver" data-arg="'+esc(x.driverId)+'">'+esc(drv(x.driverId).name)+"</button>":dlink(x.driverId))+'</td><td class="n">'+esc(x.start??"–")+'</td><td class="n">'+esc(int(x.lapsLed)||0)+'</td><td class="n">'+esc(x.lapsComp??"–")+'</td><td class="n">'+esc(int(x.inc)||0)+'x</td><td class="'+(isDnf(x.status)?"muted":"")+'">'+esc(x.status||"Running")+"</td>"+
      (hasStage?'<td class="n">'+(num(x.stage,0)||"")+"</td>":"")+(hasRating?'<td class="n">'+(x.rating!=null?Number(x.rating).toFixed(1):"–")+"</td>":"")+'<td class="n"><b>'+(r.exhibition?"–":S.calc.ptsFor(x,maxLed))+"</b>"+(num(x.pen,0)?' <span class="small" style="color:var(--bad)">('+num(x.pen,0)+")</span>":"")+"</td></tr>").join("")+"</tbody></table></div>"+
    (pen.length?'<p class="hint" style="margin:8px">Penalties: '+pen.map(p=>esc((drv(p.driverId)||{name:"Driver"}).name)+" −"+num(p.points,0)+" ("+esc(p.infraction)+")").join("; ")+"</p>":"");}

V.drivers=()=>{const c=S.calc;if(S.driverSel&&c.D[S.driverSel])return driverDetail(c.D[S.driverSel]);

function driverDetail(s){const c=S.calc,d=s.driver,rk=c.rank[d.id],pens=S.penalties.filter(p=>p.driverId===d.id);
  let h='<section class="stack"><div><button class="btn sm ghost" data-act="nav" data-arg="drivers">← All drivers</button></div><div class="dhero"><span class="big">'+(d.number!==undefined&&String(d.number)!==""?"#"+esc(d.number):"—")+'</span><div><h1>'+esc(d.name)+'</h1><div class="muted">'+(rk?"P"+rk+" in points":"No starts yet")+(d.team?" · "+esc(d.team):"")+(d.custId?" · iRacing ID "+esc(d.custId):"")+"</div></div></div>";

  h+='<div class="tiles">'+tile(fmtN(s.total),"Points")+tile(s.starts,"Starts")+tile(s.wins,"Wins")+tile(s.top5,"Top 5s")+tile(s.top10,"Top 10s")+(o&&o.podiums!=null?tile(o.podiums,"Podiums"):"")+tile(s.poles,"Poles")+tile(s.led,"Laps led")+(o?tile(o.stgPts,"Stage pts")+tile(o.stgWins,"Stage wins"):"")+tile(s.avgFin?s.avgFin.toFixed(1):"–","Avg finish")+tile(s.avgStart?s.avgStart.toFixed(1):"–","Avg start")+tile(s.best??"–","Best finish")+tile(s.inc+"x","Incidents")+tile(s.starts?(s.inc/s.starts).toFixed(1)+"x":"–","Inc per race")+tile(s.dnf,"DNFs")+(o&&o.rating!=null?tile(Number(o.rating).toFixed(1),"Avg rating"):"")+
    (o?(num(o.penPts,0)?tile(fmtN(o.penPts),"Penalty pts"):""):(s.penPts?tile("−"+s.penPts,"Penalty pts"):""))+"</div>";
  h+='<div class="panel"><div class="sechead"><div class="lt">Finishes by round</div><div class="row"><button class="btn sm" data-act="compare" data-arg="'+esc(d.id)+'">Head to head</button>'+(S.idx?'<button class="btn sm" data-act="career" data-arg="'+esc(d.id)+'">INRS career</button>':"")+(s.starts?'<button class="btn sm" data-act="wrapped" data-arg="'+esc(d.id)+'">'+esc(selInfo().year)+' Wrapped</button>':"")+"</div></div>"+finishChart([seriesFor(s,"var(--accent)")])+"</div>";
  h+=rivalsPanel(d.id);
  h+='<div class="panel" style="padding:6px 8px"><div class="lt" style="margin:8px">Race log</div>'+(s.log.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Race</th><th class="n">Start</th><th>Fin</th><th class="n">Led</th><th class="n">Inc</th><th>Status</th><th class="n">Pts</th></tr></thead><tbody>'+
    s.log.map(l=>'<tr><td><button class="dl" data-act="openrace" data-arg="'+esc(l.race.id)+'">'+esc(raceLabel(l.race))+'</button></td><td class="n">'+esc(l.start??"–")+"</td><td>"+posBadge(l.fin)+'</td><td class="n">'+l.led+'</td><td class="n">'+l.inc+"x</td><td>"+esc(l.status)+'</td><td class="n"><b>'+l.pts+"</b></td></tr>").join("")+"</tbody></table></div>":empty("No races yet",""))+"</div>";
  if(pens.length)h+='<div class="panel"><div class="lt">Penalties</div>'+penTable(pens)+"</div>";
  return h+"</section>";}

function penTable(list){const rr=id=>S.races.find(r=>r.id===id);

function isRaceDay(r){if(!r||!r.date)return false;const a=new Date(r.date),b=new Date();return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

/* ---------- tracks ---------- */
const TRACKS=[[/Raceway Park|\bIRP\b/i,"irp","Lucas Oil Raceway (IRP)"],[/Milwaukee/i,"milwaukee","Milwaukee Mile"],[/Rockingham/i,"rockingham","Rockingham"],[/Lime Rock/i,"lime-rock","Lime Rock"],[/Portland/i,"portland","Portland"],[/Gilles Villeneuve|Montreal/i,"montreal","Montreal"],[/Daytona/i,"daytona","Daytona"],[/Charlotte.*Roval/i,"charlotte-roval","Charlotte Roval"],[/Charlotte/i,"charlotte","Charlotte"],[/Gateway|World Wide Technology/i,"gateway","Gateway"],
 [/Sonoma/i,"sonoma","Sonoma"],[/Nashville/i,"nashville","Nashville"],[/Road America/i,"road-america","Road America"],[/Atlanta/i,"atlanta","Atlanta"],[/New Hampshire/i,"new-hampshire","New Hampshire"],
 [/Pocono/i,"pocono","Pocono"],[/Indianapolis.*Road/i,"indy-road","Indianapolis Road Course"],[/Indianapolis/i,"indianapolis","Indianapolis"],[/Michigan/i,"michigan","Michigan"],[/Richmond/i,"richmond","Richmond"],
 [/Watkins Glen/i,"watkins-glen","Watkins Glen"],[/Darlington/i,"darlington","Darlington"],[/Kansas/i,"kansas","Kansas"],[/Bristol.*Dirt/i,"bristol-dirt","Bristol Dirt"],[/Bristol/i,"bristol","Bristol"],
 [/Texas/i,"texas","Texas"],[/Talladega/i,"talladega","Talladega"],[/Las Vegas/i,"las-vegas","Las Vegas"],[/Homestead/i,"homestead","Homestead-Miami"],[/Martinsville/i,"martinsville","Martinsville"],
 [/Phoenix/i,"phoenix","Phoenix"],[/Coliseum/i,"la-coliseum","LA Coliseum"],[/Auto Club/i,"auto-club","Auto Club"],[/Circuit of the Americas/i,"cota","COTA"],[/Dover/i,"dover","Dover"],
 [/North Wilkesboro/i,"north-wilkesboro","North Wilkesboro"],[/Chicago Street/i,"chicago-street","Chicago Street Course"],[/Chicagoland/i,"chicagoland","Chicagoland"],[/Iowa/i,"iowa","Iowa"],[/Coronado|San Diego/i,"san-diego","San Diego Street Course"]];
function trackOf(name){const s=String(name||"");for(const[re,k,l]of TRACKS)if(re.test(s))return{key:k,label:l};const l=s.replace(/\[Retired\]\s*/g,"").trim()||"Unknown";return{key:l.toLowerCase().replace(/[^a-z0-9]+/g,"-"),label:l};}
function buildTracks(){const T={};const add=(name,o)=>{const t=trackOf(name);(T[t.key]=T[t.key]||{key:t.key,label:t.label,races:[]}).races.push(o);return t.key;};
  (S.history||[]).forEach(h=>{const du=isDuel({name:h[3]});add(h[4],{season:+h[0],round:h[1],date:h[2],event:h[3],pole:h[5],winner:h[6],exhibition:du,duel:du});});
  const season=+settings().season||new Date().getFullYear();
  sortedRaces().forEach(r=>{const res=r.results||[],w=res.find(x=>int(x.fin)===1),p=res.find(x=>int(x.start)===1);
    add(r.track,{season,round:r.round,date:fmtShort(r.date),event:r.name||"",pole:p&&drv(p.driverId)?drv(p.driverId).name:"",winner:w&&drv(w.driverId)?drv(w.driverId).name:"",raceId:r.id,current:true,done:r.status==="complete"&&res.length,exhibition:!!r.exhibition,duel:!!r.duel});});
  Object.values(T).forEach(t=>{t.races.sort((a,b)=>b.season-a.season||(int(b.round)||0)-(int(a.round)||0));
    const wins={};t.races.forEach(r=>{if(r.winner&&!r.exhibition)wins[r.winner]=(wins[r.winner]||0)+1;});t.wins=Object.entries(wins).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    t.onSchedule=t.races.some(r=>r.current);t.next=t.races.filter(r=>r.current&&!r.done).sort((a,b)=>(int(a.round)||0)-(int(b.round)||0))[0]||null;});
  return T;}
function mostWins(t){if(!t.wins.length)return null;const top=t.wins[0][1],tied=t.wins.filter(w=>w[1]===top);
  const who=tied.length===1?tied[0][0]:top===1?"Multiple drivers tied":tied.length===2?tied[0][0]+" & "+tied[1][0]:tied.length+" drivers tied";
  return{who,n:top,tied:tied.length>1,detail:top===1&&tied.length>1?"1 win each":tied.length>1?top+" wins each":plural(top,"win")};}
function pastWinnersLine(trackName){const T=buildTracks(),t=T[trackOf(trackName).key];if(!t)return"";
  const past=t.races.filter(r=>r.winner&&!r.exhibition).slice(0,4);if(!past.length)return"";
  return'<div class="pastw"><span class="muted">Past winners here:</span> '+past.map(r=>"<b>"+esc(r.winner)+'</b> <span class="muted">'+r.season+"</span>").join(" · ")+' <button class="btn sm ghost" data-act="track" data-arg="'+esc(t.key)+'">Track history</button></div>';}
V.tracks=()=>{const T=buildTracks();if(S.trackSel&&T[S.trackSel])return trackDetail(T[S.trackSel]);
  const list=Object.values(T).sort((a,b)=>(b.onSchedule-a.onSchedule)||((a.next?int(a.next.round):999)-(b.next?int(b.next.round):999))||a.label.localeCompare(b.label));
  if(!list.length)return'<div class="lt">Tracks</div>'+empty("No track history yet","");
  const card=t=>{const lw=t.races.find(r=>r.winner&&!r.exhibition),mw=mostWins(t);
    return'<button class="dcard tcard" data-act="track" data-arg="'+esc(t.key)+'"><span class="nm">'+esc(t.label)+'</span><span class="st">'+plural(t.races.filter(r=>r.winner&&!r.exhibition).length,"race")+(t.next?" · Next: Rd "+esc(t.next.round):"")+"</span>"+
      (lw?'<span class="small">Last winner: <b>'+esc(lw.winner)+'</b> <span class="muted">'+lw.season+"</span></span>":"")+(mw&&(mw.n>1||mw.tied)?'<span class="small muted">Most wins: '+esc(mw.who)+" ("+mw.detail+")</span>":"")+"</button>";};
  const on=list.filter(t=>t.onSchedule),off=list.filter(t=>!t.onSchedule);
  return'<section class="stack"><div><div class="lt">'+esc(settings().season)+' tracks</div><div class="dgrid">'+on.map(card).join("")+"</div></div>"+(off.length?'<div><div class="lt">Past tracks</div><div class="dgrid">'+off.map(card).join("")+"</div></div>":"")+
    '<p class="hint">History covers '+esc(settings().name)+' races on SimRacerHub'+(()=>{const y=(S.history||[]).map(h=>+h[0]).concat([+settings().season]).filter(Boolean);return y.length?" since "+Math.min(...y):"";})()+'.</p></section>';};
function trackDetail(t){const season=+settings().season;

    return[r.driverId,d.name,d.number||"",r.pos,r.pts,num(r.starts),num(r.wins),num(r.t5),num(r.t10),num(r.poles),num(r.led),num(r.inc),f[0],f[1],r.team||""];});}

/* ---------- chase ---------- */
function chaseData(){const c=S.calc,o=c.off;if(!o)return null;const cut=num(o.chaseCutoff,0);if(!cut)return null;
  const rows=c.standings.filter(s=>s.off&&s.off.pos<=cut).sort((a,b)=>a.off.pos-b.off.pos);if(!rows.length)return null;
  const start=sortedRaces().find(r=>/chase/i.test(r.note||""));const startRound=start?num(start.round,0):0;
  const remaining=sortedRaces().filter(r=>!r.exhibition&&!(r.status==="complete"&&(r.results||[]).length)&&num(r.round,0)>=startRound).length;
  const chaseRaces=sortedRaces().filter(r=>!r.exhibition&&r.status==="complete"&&(r.results||[]).length&&num(r.round,0)>=startRound);
  const max=num(settings().maxPerRace,66),lead=num(rows[0].off.pts,0),pool=remaining*max;
  const out=rows.map(s=>{const pts=num(s.off.pts,0),beh=lead-pts,fins=chaseRaces.map(r=>{const x=r.results.find(y=>y.driverId===s.driver.id);return x?int(x.fin):null;});
    const ok=fins.filter(f=>f);return{s,pts,beh,alive:beh===0||beh<=pool,fins,avg:ok.length?ok.reduce((a,b)=>a+b,0)/ok.length:null,perRace:remaining?beh/remaining:null};});
  const second=out[1];const clinched=second&&remaining>=0&&(lead-second.pts)>pool;
  return{cut,rows:out,remaining,chaseRaces,max,pool,clinched,start};}
function chasePanel(full){const d=chaseData();if(!d)return"";

  const head='<div class="sechead"><div class="lt">The Chase</div><span class="hint">'+(d.remaining?plural(d.remaining,"race")+" left · up to "+fmtN(d.pool)+" pts still available":"Final")+"</span></div>";
  if(!full){return'<div class="panel">'+head+'<div class="scroll"><table class="tbl"><thead><tr><th>Pos</th><th>Driver</th><th class="n">Pts</th><th class="n">Behind</th></tr></thead><tbody>'+

/* ---------- Chase: what it takes ---------- */
const ordinal=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
const trackShort=r=>r?trackOf(r.track).label:"the next race";
function finishEx(d,other){const T=settings().points.table,win=num(T[0],0);if(d<=0)return"";
  if(d<=win){let p=T.findIndex(v=>num(v,0)<=win-d)+1;if(p<1)p=T.length+1;return" — e.g. a win with "+esc(other)+" "+ordinal(p)+" or worse";}
  return" — that takes a win plus stage points with "+esc(other)+" near the back";}
function chaseScenarios(d){if(!d||d.clinched||!d.remaining)return[];const M=d.max,R=d.remaining,up=sortedRaces().filter(r=>!r.exhibition&&!(r.status==="complete"&&(r.results||[]).length));
  const next=up[0],nt="<b>"+esc(trackShort(next))+"</b>",L=d.rows[0],P2=d.rows[1],Ln=L.s.driver.name,out=[];
  if(P2){const lead=L.pts-P2.pts,need=(R-1)*M-lead+1,P2n=P2.s.driver.name;let t;
    if(R===1)t="Wins the title at "+nt+" unless "+esc(P2n)+" outscores "+esc(Ln)+" by more than "+lead+" (a tie goes to the tiebreaker).";
    else if(need<=0)t="Clinches at "+nt+" unless "+esc(P2n)+" outscores "+esc(Ln)+" there by "+(1-need)+" or more.";
    else if(need<=M)t="Clinches at "+nt+" by outscoring "+esc(P2n)+" by "+need+" or more"+finishEx(need,P2n)+".";
    else{const k=Math.floor((R*M-lead)/(2*M))+1;t=k<R?"Can't clinch at "+nt+". Earliest possible clinch: <b>"+esc(trackShort(up[k-1]))+"</b>.":"Can't clinch before the finale at <b>"+esc(trackShort(up[R-1]))+"</b>.";}
    out.push({r:L,head:"Leader",text:t+" Leads "+esc(P2n)+" by "+lead+"."});}
  d.rows.slice(1).filter(r=>r.alive).forEach(r=>{const beh=r.beh;let t;
    if(R===1)t="Needs to outscore "+esc(Ln)+" by more than "+beh+" at "+nt+finishEx(beh+1,Ln)+".";
    else{const must=beh-(R-1)*M;t="Needs "+beh+" more points than "+esc(Ln)+" over the last "+R+" races ("+(beh/R).toFixed(1)+" a race). ";
      t+=must>0?"Must outscore "+esc(Ln)+" by at least "+must+" at "+nt+" to stay alive"+finishEx(must,Ln)+".":(-must)<M?"Is eliminated at "+nt+" if "+esc(Ln)+" outscores them "+(must===0?"at all":"by more than "+(-must))+".":(()=>{const k=Math.floor((R*M-beh)/(2*M))+1;
        return k<R?"Can't be eliminated at "+nt+". The earliest they could be knocked out is <b>"+esc(trackShort(up[k-1]))+"</b>.":"Can't be eliminated before the finale at <b>"+esc(trackShort(up[R-1]))+"</b>.";})();}
    out.push({r,head:beh?"−"+beh:"Tied",text:t});});
  return out;}
function scenarioPanel(d){const sc=chaseScenarios(d);if(!sc.length)return"";const out=d.rows.filter(r=>!r.alive).length;
  return'<div class="panel"><div class="sechead"><div class="lt">What it takes</div><span class="hint">'+plural(d.remaining,"race")+" left · "+d.max+" pts max per race</span></div><div class=\"list\">"+
    sc.map(x=>'<div class="scen"><div class="scen-h">'+posBadge(x.r.s.off.pos)+'<div class="name">'+dlink(x.r.s.driver.id)+'</div><span class="pts">'+fmtN(x.r.pts)+'</span></div><p>'+x.text+"</p></div>").join("")+"</div>"+
    (out?'<p class="hint" style="margin:10px 0 0">'+plural(out,"driver")+" can no longer catch the leader.</p>":"")+
    '<p class="hint" style="margin:6px 0 0">Points swings include stage and bonus points. Finishing examples use race points only (win '+num(settings().points.table[0],0)+"). Scenarios compare each driver with the leader.</p></div>";}

/* ---------- power rankings ---------- */
const PW=[1,0.9,0.8,0.7,0.6];
function powerAt(done,n){const win=done.slice(Math.max(0,n-5),n).reverse(),S2={};
  win.forEach((r,i)=>{const maxLed=Math.max(0,...r.results.map(x=>int(x.lapsLed)||0));r.results.forEach(x=>{const f=int(x.fin);if(!f)return;
    const s=S2[x.driverId]=S2[x.driverId]||{id:x.driverId,score:0,fins:Array(win.length).fill(null),finSum:0,n:0,wins:0};
    s.score+=PW[i]*S.calc.ptsFor(x,maxLed);s.fins[i]=f;s.finSum+=f;s.n++;if(f===1)s.wins++;});});
  const L=Object.values(S2).filter(s=>drv(s.id)).sort((a,b)=>b.score-a.score||a.finSum/a.n-b.finSum/b.n);L.forEach((s,i)=>s.rank=i+1);return{list:L,races:win};}
function powerData(){const done=S.calc.done.filter(r=>!r.exhibition&&(r.results||[]).length);if(done.length<2)return null;
  const cur=powerAt(done,done.length),prev=powerAt(done,done.length-1),pr={};prev.list.forEach(s=>pr[s.id]=s.rank);
  cur.list.forEach(s=>{s.prev=pr[s.id]||null;s.move=s.prev?s.prev-s.rank:null;});return cur;}

  const fch=s=>'<div class="chips">'+[...s.fins].reverse().map((f,i)=>'<span class="fchip '+(f===1?"w":f&&f<=5?"t5":"")+'" title="'+esc(raceLabel(p.races[p.races.length-1-i]))+'">'+(f??"–")+"</span>").join("")+"</div>";
  return'<section><div class="lt">Power rankings</div><p class="hint" style="margin:0 0 10px">Form over the last '+plural(p.races.length,"race")+" (through "+esc(raceLabel(p.races[0]))+"). Points scored in each race, with the most recent counting most (×1.0 down to ×0.6). Arrows compare with last week.</p>"+
    '<div class="panel" style="padding:6px 8px"><div class="scroll"><table class="tbl"><thead><tr><th>Rank</th><th></th><th>Driver</th><th>Last '+p.races.length+' (oldest → newest)</th><th class="n">Score</th><th class="n">Avg fin</th><th class="n">Pts pos</th></tr></thead><tbody>'+
    p.list.slice(0,20).map(s=>"<tr><td>"+posBadge(s.rank)+"</td><td>"+moveTag(s)+"</td><td>"+dlink(s.id)+"</td><td>"+fch(s)+'</td><td class="n"><span class="pts">'+Math.round(s.score)+'</span></td><td class="n">'+(s.finSum/s.n).toFixed(1)+'</td><td class="n muted">'+(S.calc.rank[s.id]?"P"+S.calc.rank[s.id]:"–")+"</td></tr>").join("")+
    "</tbody></table></div></div></section>";}
function powerPanel(){const p=powerData();if(!p)return"";
  return'<div class="panel"><div class="sechead"><div class="lt">Power rankings</div><button class="btn sm ghost" data-act="stdview" data-arg="power">Top 20</button></div><div class="list">'+

const LADDER=[100,110,120,130,140,150,160,175,200,225,250,275,300,350,400,450,500,550,600,650,700,800,900,1000,1100,1200,1400,1500,1600,1800,2000,2200,2500,2800,3000,3500,4000,4500,5000,6000,7000,8000,10000,12500,15000,20000,25000];

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function prevSeasonKey(){const i=selInfo();const p=S.idx&&S.idx.seasons.find(x=>x.series===i.series&&+x.year===+i.year-1);return p?p.key:null;}
function oddsData(noLive){const c=S.calc,r=c.next;if(!r)return null;const tk=trackOf(r.track).key,ty=typeOf(r.track);
  const done=c.done.filter(x=>!x.exhibition&&(x.results||[]).length);if(done.length<3)return null;

function finishChart(series){const races=sortedRaces().filter(r=>!r.exhibition&&r.status==="complete"&&(r.results||[]).length);if(!races.length)return"";
  const W=760,H=240,L=34,R=12,T=14,B=28,maxF=Math.max(10,...series.flatMap(s=>s.pts.map(p=>p.fin||0)));const ymax=Math.ceil(maxF/5)*5;
  const x=i=>L+(races.length===1?0:i*(W-L-R)/(races.length-1)),y=f=>T+(f-1)*(H-T-B)/(ymax-1);
  let g="";[1,5,10,20,30,40].filter(v=>v<=ymax).forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="cg"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ct">'+v+"</text>";});
  races.forEach((r,i)=>{if(i%5===0||i===races.length-1)g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" class="ct">'+esc(r.round)+"</text>";});
  series.forEach((s,si)=>{const pts=races.map((r,i)=>{const p=s.pts.find(q=>q.raceId===r.id);return p&&p.fin?{i,fin:p.fin,r}:null;});
    let d="",pen=false;pts.forEach(p=>{if(!p){pen=false;return;}d+=(pen?"L":"M")+x(p.i).toFixed(1)+" "+y(p.fin).toFixed(1)+" ";pen=true;});
    g+='<path d="'+d+'" class="cl" style="stroke:'+s.color+'"/>';
    pts.forEach(p=>{if(!p)return;const win=p.fin===1;g+='<circle cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.fin).toFixed(1)+'" r="'+(win?5:3.2)+'" style="fill:'+(win?"var(--gold)":s.color)+'"><title>'+esc(s.name+": P"+p.fin+" · "+raceLabel(p.r))+"</title></circle>";});});
  return'<div class="chartwrap"><svg viewBox="0 0 '+W+" "+H+'" class="chart" role="img" aria-label="Finishing position by round">'+g+'</svg>'+
    (series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+"</span>").join("")+"</div>":"")+'<div class="hint" style="margin-top:4px">Finishing position (1 at the top) for each round. Gold dots are wins.</div></div>';}

/* ---------- clean racing (incidents per race, clean races, penalties) ---------- */
/* SimRacerHub records 0 incidents for everyone at some road courses (COTA, Watkins Glen, Sonoma...). A race where every
   finisher shows 0x has no incident data, so it's left out instead of counting as a perfectly clean race. */
function cleanData(){const c=S.calc,has=new Set(c.done.filter(r=>(r.results||[]).some(x=>int(x.inc)>0)).map(r=>r.id)),run=has.size;if(!run)return null;const min=Math.max(1,Math.ceil(run/2));
  const rows=c.standings.map(s=>({s,L:s.log.filter(l=>has.has(l.race.id))})).filter(z=>z.L.length).map(({s,L})=>{const inc=L.reduce((a,l)=>a+(int(l.inc)||0),0),n=L.length,l5=L.slice(-5),i5=l5.reduce((a,l)=>a+(int(l.inc)||0),0)/l5.length;
    const pens=S.penalties.filter(p=>p.driverId===s.driver.id);return{s,n,inc,ipr:inc/n,clean:L.filter(l=>!int(l.inc)).length,i5,trend:i5-inc/n,pens:pens.length,penPts:pens.reduce((a,p)=>a+num(p.points,0),0),ok:n>=min};});
  const q=rows.filter(r=>r.ok).sort((a,b)=>a.ipr-b.ipr||b.clean-a.clean||b.n-a.n),all=rows.reduce((a,r)=>a+r.inc,0),st=rows.reduce((a,r)=>a+r.n,0);
  const perRace=c.done.filter(r=>has.has(r.id)).map(r=>{const res=(r.results||[]).filter(x=>int(x.fin));return{r,avg:res.length?res.reduce((a,x)=>a+(int(x.inc)||0),0)/res.length:0};});
  return{q,min,run,avg:st?all/st:0,perRace,others:rows.filter(r=>!r.ok).length,skipped:c.done.filter(r=>!has.has(r.id))};}
function cleanView(){const d=cleanData();if(!d)return empty("No races yet","Clean racing stats appear after the first race.");const top=d.q[0];
  const best=[...d.perRace].sort((a,b)=>a.avg-b.avg)[0],worst=[...d.perRace].sort((a,b)=>b.avg-a.avg)[0];
  const ar=t=>Math.abs(t)<0.25?'<span class="muted">–</span>':t<0?'<span style="color:var(--ok)">▼'+Math.abs(t).toFixed(1)+"</span>":'<span style="color:var(--bad)">▲'+t.toFixed(1)+"</span>";
  return'<section class="stack"><div class="tiles">'+tile(top?top.s.driver.name:"–","Cleanest driver"+(top?" ("+top.ipr.toFixed(1)+"x a race)":""),true)+tile(d.avg.toFixed(1)+"x","League average per start")+
    tile(best?trackOf(best.r.track).label:"–","Cleanest race"+(best?" ("+best.avg.toFixed(1)+"x avg)":""),true)+tile(worst?trackOf(worst.r.track).label:"–","Wildest race"+(worst?" ("+worst.avg.toFixed(1)+"x avg)":""),true)+"</div>"+
    '<div class="panel" style="padding:6px 8px"><div class="sechead" style="margin:8px"><div class="lt">Cleanest drivers</div><span class="hint">Fewest incidents per race · at least '+plural(d.min,"start")+'</span></div><div class="scroll"><table class="tbl"><thead><tr><th>Rank</th><th>Driver</th><th class="n">Starts</th><th class="n">Inc</th><th class="n">Per race</th><th class="n">Clean races</th><th class="n">Last 5</th><th class="n">Trend</th><th class="n">Penalties</th></tr></thead><tbody>'+
    d.q.map((r,i)=>"<tr><td>"+posBadge(i+1)+"</td><td>"+dlink(r.s.driver.id)+'</td><td class="n">'+r.n+'</td><td class="n">'+r.inc+'x</td><td class="n"><span class="pts">'+r.ipr.toFixed(1)+'x</span></td><td class="n">'+r.clean+'</td><td class="n">'+r.i5.toFixed(1)+'x</td><td class="n">'+ar(r.trend)+'</td><td class="n">'+(r.pens?r.pens+" (−"+r.penPts+" pts)":"–")+"</td></tr>").join("")+
    '</tbody></table></div><p class="hint" style="margin:10px 8px">Counts every race this season with incident data'+(d.skipped.length?" (no incidents were recorded at "+esc(d.skipped.map(r=>trackOf(r.track).label).join(", "))+", so those races are left out)":"")+'. Clean races are races with 0 incidents. Trend compares the last 5 races with the season average (▼ is cleaner). '+(d.others?plural(d.others,"driver")+" with fewer starts are not ranked.":"")+"</p></div>"+
    '<div class="panel" style="padding:6px 8px"><div class="lt" style="margin:8px">Incidents by race</div><div class="list">'+d.perRace.slice().reverse().map(z=>{const w=Math.min(100,z.avg/Math.max(1,worst.avg)*100);
      return'<div class="podrow"><span class="small muted" style="min-width:34px">Rd '+esc(z.r.round)+'</span><div class="name">'+esc(trackOf(z.r.track).label)+'<div style="height:6px;background:var(--line);border-radius:3px;margin-top:4px"><div style="height:6px;width:'+w.toFixed(0)+'%;background:var(--accent);border-radius:3px"></div></div></div><span class="pts">'+z.avg.toFixed(1)+"x</span></div>";}).join("")+
    '</div><p class="hint" style="margin:10px 8px">Average incidents per finisher in each race.</p></div></section>';}

/* ---------- CSV import ---------- */
function parseCSV(text){const rows=[];let row=[],cell="",q=false;text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}return rows.map(r=>r.map(c=>c.trim()));}
function importIracing(text){const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r.some(c=>/^fin\s*pos$/i.test(c))&&r.some(c=>/^name$/i.test(c)));
  if(hi<0)throw new Error("This file doesn't look like an iRacing results export. Look for the Fin Pos and Name columns.");
  const H=rows[hi].map(c=>c.toLowerCase().replace(/[^a-z#]/g,""));const col=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i;}return-1;};
  const ix={fin:col("finpos"),name:col("name"),cust:col("custid"),start:col("startpos"),car:col("car#","carnumber","carno"),out:col("out"),led:col("lapsled"),comp:col("lapscomp","lapscompleted"),inc:col("inc","incidents")};
  const body=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r.length||r.every(c=>!c))break;if(!/^\d+$/.test(r[ix.fin]||""))continue;body.push(r);}
  if(!body.length)throw new Error("No finishing rows were found in this file.");
  const g=(r,k)=>ix[k]>=0?(r[ix[k]]||""):"";
  const finBase=Math.min(...body.map(r=>int(g(r,"fin"))))===0?1:0;
  const starts=body.map(r=>int(g(r,"start"))).filter(x=>x!==null);const startBase=starts.length&&Math.min(...starts)===0?1:0;
  let fresh=0;
  const out=body.map(r=>{const cust=g(r,"cust"),name=g(r,"name"),car=g(r,"car").replace(/^#/,"");
    let d=cust?S.drivers.find(x=>String(x.custId||"")===cust):null;if(!d)d=S.drivers.find(x=>String(x.name||"").toLowerCase()===name.toLowerCase());
    if(!d)fresh++;const st=int(g(r,"start")),o=g(r,"out");
    return{driverId:d?d.id:"__new",newName:d?"":name,newNumber:d?"":car,newCust:d?"":cust,fin:String(int(g(r,"fin"))+finBase),start:st===null?"":String(st+startBase),led:String(int(g(r,"led"))||0),comp:g(r,"comp"),inc:String(int(g(r,"inc"))||0),status:!o||/running/i.test(o)?"Running":o,bonus:"0"};});
  return{rows:out,fresh};}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(!fn)return;e.preventDefault();
  if(el.dataset.act!=="askdel"&&S.confirm&&!/^del/.test(el.dataset.act))S.confirm=null;fn(el.dataset.arg,el);});
document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.f;if(p)setPath(S.forms,p,e.target.value);});
function findDriver(q){const v=String(q||"").trim().toLowerCase();if(!v)return null;const L=S.cmpAll||S.drivers;
  const ex=L.find(d=>dlabel(d).toLowerCase()===v);if(ex)return ex;
  const n=v.replace(/^#/,"");if(/^\d+$/.test(n)){const m=L.filter(d=>String(d.number)===n);if(m.length===1)return m[0];}
  const m=L.filter(d=>String(d.name).toLowerCase().includes(v.replace(/^#\d+\s*/,"")));return m.length===1?m[0]:null;}
function pickCmp(el,final){const d=findDriver(el.value);const i=el.dataset.cmp==="a"?0:1;
  if(d&&S.cmp&&S.cmp[1-i]===d.id){toast(d.name+" is already on the other side. Pick a different driver.",true);draw();return;}
  if(d){const changed=!S.cmp||S.cmp[i]!==d.id;S.cmp=S.cmp||[];S.cmp[i]=d.id;if(changed||final)draw();return;}
  if(final){toast("No single driver matches \""+el.value+"\". Try more of the name or the full car number.",true);draw();}}
/* head-to-head driver picker */
function cmpMatches(q){const L=S.cmpAll||[],v=String(q||"").trim().toLowerCase().replace(/^#/,"");if(!v)return L;
  return L.filter(d=>String(d.number)===v||String(d.number).startsWith(v)&&/^\d+$/.test(v)||String(d.name).toLowerCase().includes(v)||dlabel(d).toLowerCase().includes(v));}
function cmpOpen(el,q){const pop=document.getElementById("cmp-pop-"+el.dataset.cmp);if(!pop)return;const i=el.dataset.cmp==="a"?0:1,cur=S.cmp&&S.cmp[i],other=S.cmp&&S.cmp[1-i];
  const L=cmpMatches(q),rk=S.calc?S.calc.rank:{};
  pop.innerHTML=L.length?L.map(d=>'<button type="button" class="opt'+(d.id===cur?" cur":"")+(d.id===other?" dis":"")+'" role="option" tabindex="-1" data-pick="'+esc(d.id)+'"'+(d.id===cur?' aria-selected="true"':"")+">"+carno(d)+esc(d.name)+(rk[d.id]?"<small>P"+rk[d.id]+"</small>":"")+"</button>").join(""):'<div class="none">No driver matches "'+esc(q)+'"</div>';
  pop.hidden=false;el.setAttribute("aria-expanded","true");pop.dataset.ai="-1";
  const c=pop.querySelector(".opt.cur");if(c&&!q)pop.scrollTop=c.offsetTop-pop.clientHeight/2+c.offsetHeight/2;}
function cmpClose(el){const pop=el&&document.getElementById("cmp-pop-"+el.dataset.cmp);if(pop){pop.hidden=true;pop.innerHTML="";}if(el)el.setAttribute("aria-expanded","false");}
function cmpChoose(which,id){const i=which==="a"?0:1,d=(S.cmpAll||[]).find(x=>x.id===id);if(!d)return;
  const el=document.getElementById("cmp-"+which);if(el){cmpClose(el);el.blur();}
  if(S.cmp&&S.cmp[1-i]===id){toast(d.name+" is already on the other side. Pick a different driver.",true);draw();return;}
  S.cmp=S.cmp||[];S.cmp[i]=id;S.pending=false;draw();}
document.addEventListener("focusin",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp){try{el.select();}catch(_){}cmpOpen(el,"");}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp)cmpOpen(el,el.value);});
document.addEventListener("mousedown",e=>{if(e.target.closest&&e.target.closest(".pop"))e.preventDefault();});
document.addEventListener("click",e=>{const o=e.target.closest&&e.target.closest("[data-pick]");if(!o)return;const pop=o.closest(".pop");cmpChoose(pop.id.slice(-1),o.dataset.pick);});
document.addEventListener("focusout",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp)setTimeout(()=>{if(document.activeElement===el)return;cmpClose(el);const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.cmp){const i=el.dataset.cmp==="a"?0:1,d=(S.cmpAll||[]).find(x=>S.cmp&&x.id===S.cmp[i]);if(d)el.value=dlabel(d);}else draw();},120);});
document.addEventListener("keydown",e=>{const el=e.target;if(!(el.dataset&&el.dataset.cmp))return;const pop=document.getElementById("cmp-pop-"+el.dataset.cmp);if(!pop)return;
  const opts=[...pop.querySelectorAll(".opt")];let a=+pop.dataset.ai;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(pop.hidden)cmpOpen(el,"");if(!opts.length)return;a=e.key==="ArrowDown"?Math.min(opts.length-1,a+1):Math.max(0,a-1);
    opts.forEach((o,k)=>o.classList.toggle("act",k===a));pop.dataset.ai=a;opts[a].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){e.preventDefault();if(a>=0&&opts[a])cmpChoose(el.dataset.cmp,opts[a].dataset.pick);else if(opts.length===1)cmpChoose(el.dataset.cmp,opts[0].dataset.pick);else pickCmp(el,true);}
  else if(e.key==="Escape"){cmpClose(el);el.blur();}});
document.addEventListener("input",e=>{if(e.target.id!=="dsearch")return;SORT.q=e.target.value;const pos=e.target.selectionStart;draw();const el=document.getElementById("dsearch");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}});
document.addEventListener("change",e=>{const el=e.target,p=el.dataset&&el.dataset.f;if(p)setPath(S.forms,p,el.value);const c=el.dataset&&el.dataset.change;if(c&&CHANGE[c])CHANGE[c](el);});

/* ---------- render ---------- */
{const _cmp=V.compare;V.compare=()=>{let h=_cmp();const c=S.calc,all=c.standings.filter(s=>s.starts>0||s.off);if(all.length<2)return h;
  let[a,b]=S.cmp||[];if(!c.D[a])a=all[0].driver.id;if(!c.D[b]||b===a)b=(all.find(s=>s.driver.id!==a)||all[1]).driver.id;
  const yr=S.rivYr||0,ser=S.rivSer||"",r=h2hCareer(a,b,yr,ser),na=c.D[a].driver.name,nb=c.D[b].driver.name;
  const p=r?(r.met?'<div class="panel"><div class="sechead"><div class="lt">'+(yr?yr+" ":"Career ")+(ser?SER_L[ser]+" ":"")+"head to head"+'</div>'+rivFilters()+'</div><p style="margin:0"><b>'+esc(na)+"</b> has finished ahead of <b>"+esc(nb)+"</b> in <b>"+r.ahead+" of "+r.met+"</b> "+(ser?SER_L[ser]+" ":"")+"races they've both run"+(yr?" in "+yr:"")+(ser?"":" ("+Object.entries(r.series).map(([k,n])=>n+" "+SER_L[k]).join(", ")+")")+'.</p><div class="cbar"><i style="width:'+(r.ahead/r.met*100).toFixed(1)+'%"></i></div><div class="row small" style="justify-content:space-between"><span>'+esc(na)+" "+r.ahead+"</span><span>"+(r.met-r.ahead)+" "+esc(nb)+"</span></div></div>":'<div class="panel"><div class="sechead"><div class="lt">'+(yr?yr+" ":"Career ")+(ser?SER_L[ser]+" ":"")+"head to head"+'</div>'+rivFilters()+'</div><p class="small muted" style="margin:0">They haven\'t finished a '+(ser?SER_L[ser]+" ":"")+'race together'+(yr?" in "+yr:" yet")+'.</p></div>'):'<div class="panel"><div class="lt">Career head to head</div><p class="small muted" style="margin:0">Loading every INRS season…</p></div>';
  const i=h.lastIndexOf("</section>");return i>=0?h.slice(0,i)+p+h.slice(i):h+p;};}
function isTyping(){const a=document.activeElement;return!!(a&&a.closest&&a.closest("#main")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file");}
function render(){if(isTyping()){S.pending=true;return;}draw();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!isTyping()){S.pending=false;draw();}},0));
/* visitor counting (website only; GoatCounter, no cookies). Each tab + season counts as a page. */
let gcLast=null;
function gcTrack(){try{const g=window.goatcounter;if(!S.static||!g||typeof g.count!=="function")return;
  const key="/"+S.view+(isMain()?"":"/"+S.sel);if(key===gcLast)return;gcLast=key;
  const tab=(TABS.find(t=>t[0]===S.view)||[0,S.view==="career"?"Career":S.view==="legacy"?"Series legacy":S.view==="awards"?"Awards":S.view==="compare"?"Head to head":S.view])[1];
  g.count({path:key,title:tab+(isMain()?"":" · "+S.sel)});}catch(e){}}
window.__gcReady=()=>{gcLast=null;gcTrack();};
function draw(){S.calc=compute();if(S.mode!=="loading")setHash();const st=S.calc.st,parts=String(st.name||DEF.name).trim().split(/\s+/);
  document.getElementById("mark").textContent=parts[0];document.getElementById("series").textContent=parts.slice(1).join(" ");document.getElementById("season").textContent=st.season||"";
  S.liveTabShown=liveActive();document.getElementById("tabs").innerHTML=TABS.filter(t=>(t[0]!=="admin"||(S.admin&&isMain()))&&(t[0]!=="live"||S.liveTabShown||S.view==="live")).map(t=>'<button class="tab" data-act="nav" data-arg="'+t[0]+'"'+(S.view===t[0]||((S.view==="career"||S.view==="legacy"||S.view==="awards")&&t[0]==="records")||(S.view==="compare"&&t[0]==="drivers")||(S.view==="bets"&&t[0]==="odds")?' aria-current="page"':"")+">"+(t[0]==="live"&&liveActive()?'<span class="ldot"></span> ':"")+t[1]+"</button>").join("");
  if(S.view==="admin"&&!S.admin&&S.mode!=="loading")S.view="home";
  const sw=document.getElementById("switch");if(sw){const h=switcher();sw.hidden=!h;if(!isTyping()||!sw.contains(document.activeElement))sw.innerHTML=h;}
  const body=(S.mode==="live"&&!S.loaded)||S.mode==="loading"||S.selLoading?loading():(V[S.view]||V.home)();
  document.getElementById("main").innerHTML=notice()+(S.view==="bets"||S.view==="live"?"":archBar())+body;drawSlip();if(S.loaded&&!S.selLoading)gcTrack();
  const dc=safeUrl(st.discord),sp=safeUrl(st.sponsorUrl);
  document.getElementById("foot").innerHTML='<span class="presented">Presented by <b>'+esc(st.sponsorName||"40XLI")+"</b></span>"+(dc?'<a class="btn sm ghost" href="'+esc(dc)+'" target="_blank" rel="noopener">Discord</a>':"")+(sp?'<a class="btn sm ghost" href="'+esc(sp)+'" target="_blank" rel="noopener">'+esc(st.sponsorName||"Sponsor")+"</a>":"");}

function markReady(k){S.ready[k]=true;S.loaded=S.ready.s&&S.ready.d&&S.ready.r&&S.ready.p&&S.ready.o;render();}
function onErr(e){if(e&&e.code==="revoked"){S.mode="nodb";}render();}
async function loadStatic(){try{const r=await fetch("data.json",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
  S.static=true;Object.assign(S.M,{history:d.history||[],settingsRaw:d.settings||null,drivers:d.drivers||[],races:markDuels(d.races),penalties:d.penalties||[],official:d.official||null});applySel();
  S.mode="live";S.admin=false;S.loaded=true;S.updated=d.updated||"";}catch(e){S.mode="offline";}draw();}
async function loadIndex(){try{const r=await fetch("data/seasons.json",{cache:"no-store"});if(!r.ok)return;S.idx=await r.json();applySel();draw();}catch(e){}}
window.addEventListener("popstate",route);window.addEventListener("hashchange",route);
async function boot(){await finishSignIn();if(S.authMsg)setTimeout(()=>toast(S.authMsg,!me()),900);const h=readHash();if(VIEWS(h.v))S.view=h.v;applySub(h.sub);const arch=h.k!==MAINKEY;if(arch)S.routing=true;draw();
  loadIndex().then(async()=>{if(arch){try{await selectSeason(h.k);if(VIEWS(h.v))S.view=h.v;applySub(h.sub);}finally{S.routing=false;}draw();}});
  const c=window.claude;if(!c||typeof c.use!=="function"){await loadStatic();return;}
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  try{S.admin=user?await user.canEdit():false;}catch(e){S.admin=false;}
  if(!db){S.mode="nodb";draw();return;}
  S.db=db;S.mode="live";const r=root();
  r.onSnapshot(s=>{S.M.settingsRaw=s.exists?s.data():null;applySel();markReady("s");},onErr);
  r.collection("drivers").onSnapshot(q=>{S.M.drivers=q.docs.map(d=>Object.assign({id:d.id},d.data()));applySel();markReady("d");},onErr);
  r.collection("races").onSnapshot(q=>{S.M.races=markDuels(q.docs.map(d=>Object.assign({id:d.id},d.data())));applySel();markReady("r");},onErr);
  r.collection("penalties").onSnapshot(q=>{S.M.penalties=q.docs.map(d=>Object.assign({id:d.id},d.data()));applySel();markReady("p");},onErr);
  r.collection("official").doc("standings").onSnapshot(s=>{S.M.official=s.exists?s.data():null;applySel();markReady("o");},onErr);
  r.collection("history").doc("all").onSnapshot(s=>{const v=s.exists?s.data():null;S.M.history=v&&Array.isArray(v.rows)?v.rows:[];applySel();render();},()=>{});
  draw();}
setInterval(()=>{if(S.view==="home"&&S.loaded)render();},60000);
boot();
})();
