<style>
/* Layout: broadcast timing-tower feel. Sticky brand bar + tab rail, one column on phones, two-column grids on wide screens. Single dark look by choice: black and white with 40XLI purple as an accent only. */
:root{
  --bg:#09090A; --panel:#121214; --panel-2:#1A1A1D; --line:#242428; --line-2:#34343A;
  --fg:#F5F5F6; --muted:#9B9BA3; --accent:#B455F7; --accent-soft:#251733; --ink:#0B0B0C;
  --gold:#F2C14E; --silver:#CFC8DC; --bronze:#D58B5A; --ok:#4ADE80; --bad:#F87171;
  --display:"Inter","Arial Black",system-ui,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:10px 4px;flex-wrap:wrap}
.brandlogo{height:76px;width:auto;display:block}
@media (max-width:480px){.brandlogo{height:58px}}
.mark{font:italic 900 28px/1 var(--display);letter-spacing:-.02em}
.series{font:italic 800 13px/1 var(--display);color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.switch{margin-left:auto;display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{font:800 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 9px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:focus-visible,.yearsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{flex:none}
.switch .yearsel{width:auto;flex:none;font:600 16px/1.1 var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;cursor:pointer}
.archbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:8px 12px;border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:6px;background:var(--panel);font-size:14px}
.season{display:none;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line-2);padding:3px 8px;border-radius:4px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font:600 15px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:none;border:0;padding:10px 10px 9px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:20px 40px;display:grid;gap:24px}
main>*{min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
.lt{display:inline-flex;align-items:center;background:transparent;padding-left:0 !important;border-bottom:3px solid var(--accent);padding:6px 14px 5px;font:italic 900 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.stack{display:grid;gap:20px;min-width:0}
.hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 20px 20px}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);pointer-events:none}
.hero > *{position:relative;z-index:1}
.eyebrow{font:700 13px var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.14em}
.track{font:italic 900 clamp(32px,8vw,56px)/1 var(--display);letter-spacing:-.02em;text-transform:uppercase;margin-top:6px}
.rule{height:4px;width:72px;background:var(--accent);margin:14px 0 12px}
.rname{font-size:18px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 14px var(--mono);color:var(--muted);margin-top:6px}
.count{margin-top:14px;font:italic 800 18px var(--display);text-transform:uppercase}
.count b{color:var(--accent)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-family:var(--mono);font-size:14px}
.tbl th.n{font-family:var(--body);font-size:12px}
.tbl .wrapcell{white-space:normal;min-width:180px}
.pos{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 4px;box-sizing:border-box;font:italic 900 15px var(--display);background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px}
.p1{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.p2{background:var(--silver);color:var(--ink);border-color:var(--silver)}
.p3{background:var(--bronze);color:var(--ink);border-color:var(--bronze)}
.carno{font:italic 900 1em var(--display);color:var(--muted);margin-right:2px}
.dl{background:none;border:0;padding:0;color:var(--fg);font:600 16px var(--body);cursor:pointer;text-align:left}
.dl:hover{color:var(--accent)}
.pts{font:italic 900 18px var(--display)}
.chips{display:flex;gap:3px}
.fchip{display:inline-grid;place-items:center;min-width:24px;height:22px;font:700 11px var(--mono);border-radius:3px;background:var(--panel-2);color:var(--muted)}
.fchip.w{background:var(--gold);color:var(--ink)}
.fchip.t5{background:var(--line-2);color:var(--fg)}
.fchip.dnf{color:var(--bad)}
.pill{display:inline-block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.pill.final{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.next{color:var(--ink);background:var(--accent);border-color:var(--accent)}
.btn{font:700 14px var(--body);text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.warn{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;min-width:0}
.tile b{display:block;font:italic 900 24px/1.15 var(--display);overflow-wrap:break-word}
.tile b.sm{font-size:17px;line-height:1.3}
.tile span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.podium{display:grid;gap:8px}
.podrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--panel-2);border-radius:8px}
.podrow .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podrow .sub{font:500 12px var(--mono);color:var(--muted)}
.list{display:grid;gap:10px}
.race{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.race.isnext{border-color:var(--accent)}
.racehead{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.rnd{text-align:center}
.rnd small{display:block;font:600 10px var(--body);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.rnd b{font:italic 900 26px/1 var(--display)}
.racetitle{font:italic 900 18px/1.15 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.racesub{font:500 13px var(--mono);color:var(--muted);margin-top:2px}
.raceside{display:grid;gap:6px;justify-items:end}
.racebody{border-top:1px solid var(--line);padding:6px 8px 10px;background:var(--bg)}
.raceactions{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dcard{display:grid;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--fg);cursor:pointer;font:inherit;min-width:0}
.dcard:hover{border-color:var(--accent)}
.dcard .big{font:italic 900 42px/1 var(--display);color:var(--fg)}
.dcard .nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.dcard .st{font:500 12px var(--mono);color:var(--muted)}
.dhero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dhero .big{font:italic 900 72px/0.9 var(--display);color:var(--accent)}
.dhero h1{font:italic 900 clamp(28px,6vw,42px)/1 var(--display);text-transform:uppercase}
.recap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.play::before{content:"";border-left:14px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
details.rulesec{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.rulesec summary{cursor:pointer;padding:14px 16px;font:italic 900 17px var(--display);text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.rulesec summary::-webkit-details-marker{display:none}
details.rulesec summary::after{content:"+";color:var(--accent)}
details.rulesec[open] summary::after{content:"\2212"}
.rulebody{padding:0 16px 16px;white-space:pre-wrap;max-width:68ch;color:var(--fg)}
.empty{padding:28px 18px;text-align:center;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:italic 900 18px var(--display);text-transform:uppercase;margin-bottom:4px}
.notice{padding:14px 16px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2)}
.links{display:flex;gap:10px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding-block:20px 28px;color:var(--muted);font-size:14px}
footer .presented{font:italic 900 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
footer .presented b{color:var(--accent)}
/* Admin */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.vid{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidcard{display:grid;gap:8px;min-width:0}
.vidgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.btn.live{background:#E62117;border-color:#E62117;color:#fff}
.btn.live .dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
@media (prefers-reduced-motion:no-preference){.btn.live .dot{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.pastw{margin-top:12px;font-size:14px;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.tcard{gap:6px}.tcard .nm{font:italic 900 16px/1.2 var(--display);text-transform:uppercase;overflow-wrap:normal;word-break:normal}
.chartwrap{min-width:0}.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}.chart .ct{fill:var(--muted);font:500 11px var(--mono)}
.chart .cl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:6px}.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
.h2hpick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.cmpin{font-weight:600}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--accent)}
::selection{background:var(--accent);color:#fff}
.scen{padding:10px 4px;border-top:1px solid var(--line)}.scen:first-child{border-top:0}
.scen-h{display:flex;align-items:center;gap:10px}.scen-h .name{flex:1;min-width:0}.scen p{margin:6px 0 0 38px;font-size:15px;color:var(--muted)}.scen p b{color:var(--fg)}
.mv{font:700 12px var(--mono);color:var(--muted);white-space:nowrap}.mv.up{color:var(--ok)}.mv.dn{color:var(--bad)}.mv.new{color:var(--accent);text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.oddrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}.oddrow:first-child{border-top:0}
.orank{font:700 13px var(--mono);color:var(--muted);text-align:center}
.oname .dl{font-weight:700;font-size:17px}
.whys{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}.why{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}.why b{color:var(--fg);font-weight:600;margin-right:2px}
.oval{display:grid;justify-items:center;min-width:84px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2)}
.oval b{font:italic 900 20px var(--display);color:var(--accent)}.oval span{font:500 11px var(--mono);color:var(--muted)}
.livebar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border:1px solid #5a1e1e;background:#1c0c0c;border-radius:8px;font-size:14px}.livebar b{color:#ff4d4d;letter-spacing:.08em}
.livebar.stale{border-color:var(--line-2);background:var(--panel)}.livebar.stale b{color:var(--muted)}
.ldot{width:8px;height:8px;border-radius:50%;background:#ff3b3b;flex:none;display:inline-block}.livebar.stale .ldot{background:var(--muted)}
.why.live{color:#ff8080;font-weight:600}
@media (prefers-reduced-motion:no-preference){.livebar:not(.stale) .ldot,.why.live .ldot{animation:blink 1.4s ease-in-out infinite}}
.dot.void{background:transparent;border:2px solid var(--muted)}
.elimrow td{text-align:center;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--bad);border-top:2px dashed var(--bad)!important;padding:8px!important}
.why.pop{color:var(--gold);font-weight:600}
.mvp{font-style:normal;font-size:10px;margin-left:3px;vertical-align:2px}.mvp.up{color:var(--ok)}.mvp.dn{color:var(--bad)}.price.on .mvp{color:#fff}
.prices{display:grid;grid-template-columns:repeat(3,62px);gap:4px}
.price{display:grid;justify-items:center;gap:1px;padding:6px 2px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--fg);cursor:pointer;font:inherit}
.price small{font:600 9px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.price b{font:italic 900 15px var(--display);color:var(--accent)}
.price:hover:not([disabled]){border-color:var(--accent)}.price.on{background:var(--accent);border-color:var(--accent)}.price.on b,.price.on small{color:#fff}.price[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:520px){.oddrow{grid-template-columns:minmax(0,1fr)}.orank{display:none}.prices{grid-template-columns:repeat(3,1fr)}}
.bookbar{justify-content:space-between;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel)}.bookbar b{font-family:var(--mono);color:var(--accent)}
.slipwrap{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 12px max(12px,env(safe-area-inset-bottom))}
.slipwrap>*{pointer-events:auto}
.slipbar{display:flex;align-items:center;gap:10px;width:min(520px,100%);padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:800 14px var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.slipbar .cnt{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:#fff;color:var(--accent);font:800 13px var(--mono)}.slipbar .sb-r{margin-left:auto;font-family:var(--mono)}
.slip{width:min(520px,100%);max-height:min(75vh,640px);overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-top:3px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.7)}
.slip-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.slip-h b{font:italic 900 16px var(--display);text-transform:uppercase}.slip-h .btn{margin-left:auto}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.leg:first-child{border-top:0}
.lodds{font:italic 900 15px var(--display);color:var(--accent)}.leg .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
.stk{grid-column:1/-1;display:flex;align-items:center;gap:10px}.stk input{width:110px;padding:6px 8px}.slip>.stk{margin-top:8px}
.betgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}

.bleg{display:flex;gap:8px;align-items:flex-start;padding:4px 0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line-2);flex:none}.dot.won{background:var(--ok)}.dot.lost{background:var(--bad)}.dot.pending{background:var(--accent)}

.combo.b .pop{left:auto;right:0}
.opt{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:600 15px/1.25 var(--body);padding:8px 10px;border-radius:6px;cursor:pointer}
.opt small{margin-left:auto;padding-left:8px;color:var(--muted);font:500 12px var(--mono);white-space:nowrap}
.opt:hover,.opt.act{background:var(--accent-soft)}
.opt.cur{color:var(--accent)}.opt.dis{opacity:.4;cursor:not-allowed}
.pop .none{padding:10px;color:var(--muted);font-size:14px}
.h2hpick .vs{font:italic 900 20px var(--display);color:var(--accent)}
.h2hbig{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.h2hbig b{display:block;font:italic 900 40px/1 var(--display)}.h2hbig span{font-size:13px;color:var(--muted)}.h2hbig .mid{font:600 12px var(--mono);color:var(--muted)}
.tbl td.win{color:var(--fg);font-weight:700}.tbl td.win::after{content:" ●";color:var(--accent);font-size:10px}
.sortbtn{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
.sortbtn:hover,.sortbtn.on{color:var(--fg)}
.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sortbtn .arr{color:var(--accent)}
.dtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.dtools input{max-width:280px}
.subtabs .btn[aria-current="page"],.btn.sm[aria-current="page"]:not(.tab){background:var(--fg);color:var(--ink);border-color:var(--fg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
label.f{display:grid;gap:4px;font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;min-width:0}
input,select,textarea{font:16px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.ed td{padding:4px}

.ed select{min-width:190px;padding:6px}

.okline{font-size:14px;color:var(--ok)}

.toast.err{border-color:var(--bad)}

@media (prefers-reduced-motion:no-preference){.tab,.btn,.dcard{transition:color .15s,border-color .15s,background .15s}}
</style>

<body>


<header class="top">
  <div class="wrap">
    <div class="brandrow"><img class="brandlogo" src="logo.png" alt="INRS" width="68" height="56"><span class="mark" id="mark" hidden>INRS</span><span class="series" id="series">Cup Series</span><span class="season" id="season">2026</span><div class="switch" id="switch" hidden></div></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="skel"></div></main>
<footer><div class="wrap row" id="foot"></div></footer>
<div id="slip" class="slipwrap"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const TABS=[["home","Home"],["standings","Standings"],["schedule","Schedule"],["tracks","Tracks"],["drivers","Drivers"],["records","Records"],["odds","Sportsbook"],["recaps","Recaps"],["penalties","Penalties"],["rules","Rules"],["admin","Admin"]];
const DEFAULT_POINTS=[40].concat(Array.from({length:35},(_,i)=>35-i));
const DEF={name:"INRS Cup Series",season:"2026",discord:"",sponsorName:"40XLI Driver Academy",sponsorUrl:"",hubUrl:"",youtubeUrl:"",liveUrl:"",maxPerRace:66,points:{table:DEFAULT_POINTS,ledLap:1,mostLed:1},rules:[]};

const S={history:[],static:false,stdView:"drivers",trackSel:null,cmp:null,view:"home",mode:"loading",admin:false,db:null,settingsRaw:null,drivers:[],races:[],penalties:[],official:null,M:{drivers:[],races:[],penalties:[],official:null,history:[],settingsRaw:null},idx:null,sel:"cup-2026",arch:{},selLoading:false,
  ready:{s:false,d:false,r:false,p:false,o:false},loaded:false,driverSel:null,raceOpen:null,adminTab:"results",
  forms:{},confirm:null,pending:false,busy:false,calc:null};

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,d)=>{const n=parseFloat(v);return isFinite(n)?n:(d===undefined?0:d)};
const int=v=>{const n=parseInt(v,10);return isFinite(n)?n:null};
const safeUrl=u=>/^https?:\/\/\S+$/i.test(String(u||"").trim())?String(u).trim():"";
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
function settings(){const r=S.settingsRaw||{};const p=Object.assign({},DEF.points,r.points||{});
  if(!Array.isArray(p.table)||!p.table.length)p.table=DEFAULT_POINTS;
  return Object.assign({},DEF,r,{points:p,rules:Array.isArray(r.rules)?r.rules:[]});}
/* ---------- seasons ---------- */
const MAINKEY="cup-2026",SERIES=[["cup","Cup"],["xfinity","Xfinity"],["trucks","Trucks"]];
const isMain=()=>S.sel===MAINKEY;
const selInfo=()=>(S.idx&&S.idx.seasons.find(x=>x.key===S.sel))||{key:MAINKEY,series:"cup",year:2026,main:true};
function applySel(){const M=S.M,a=isMain()?null:S.arch[S.sel];
  if(!a){S.drivers=M.drivers;S.races=M.races;S.penalties=M.penalties;S.official=M.official;S.history=M.history;S.settingsRaw=M.settingsRaw;return;}
  const i=selInfo();S.drivers=a.drivers||[];S.races=a.races||[];S.penalties=a.penalties||[];S.official=a.official||null;
  S.history=(((S.idx||{}).history||{})[i.series]||[]).filter(h=>+h[0]<+i.year);S.settingsRaw=Object.assign({},M.settingsRaw||{},a.settings||{});}
function setHash(){try{history.replaceState(null,"","#"+S.view+(isMain()?"":"/"+S.sel));}catch(e){}}
async function selectSeason(key){if(!S.idx)return;const i=S.idx.seasons.find(x=>x.key===key);if(!i)return;
  S.sel=key;S.driverSel=null;S.trackSel=null;S.raceOpen=null;S.cmp=null;S.confirm=null;if(S.view==="admin"&&!isMain())S.view="home";setHash();
  if(!i.main&&!S.arch[key]){S.selLoading=true;draw();
    try{const r=await fetch(i.file,{cache:"no-store"});if(!r.ok)throw 0;S.arch[key]=await r.json();}catch(e){S.selLoading=false;S.sel=MAINKEY;applySel();setHash();draw();toast("Couldn't load that season. Try again.");return;}
    if(S.sel!==key)return;S.selLoading=false;}
  applySel();draw();}
function switcher(){if(!S.idx)return"";const i=selInfo(),L=S.idx.seasons;
  const years=L.filter(x=>x.series===i.series);
  return'<div class="seg" role="group" aria-label="Series">'+SERIES.filter(([k])=>L.some(x=>x.series===k)).map(([k,l])=>'<button data-act="series" data-arg="'+k+'" aria-pressed="'+(i.series===k)+'">'+l+"</button>").join("")+"</div>"+
    '<select class="yearsel" data-change="season" aria-label="Season">'+years.map(x=>'<option value="'+esc(x.key)+'"'+(x.key===S.sel?" selected":"")+">"+x.year+"</option>").join("")+"</select>";}
function archBar(){if(isMain()||!S.idx||S.view==="records"||S.view==="career")return"";const i=selInfo(),done=S.calc&&S.calc.races.length&&!S.calc.next;
  return'<div class="archbar"><span>Viewing the <b>'+i.year+" "+esc(settings().name.replace(/^INRS\s*/,""))+"</b>"+(done?" archive":"")+'</span><button class="btn sm ghost" data-act="season" data-arg="'+MAINKEY+'" style="margin-left:auto">Back to 2026 Cup</button></div>';}
function fmtDate(iso){if(!iso)return"Date TBA";const d=new Date(iso);if(isNaN(d))return"Date TBA";return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function fmtShort(iso){if(!iso)return"TBA";const d=new Date(iso);if(isNaN(d))return"TBA";return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function fmtTime(iso,dateOnly){if(!iso||dateOnly)return"";const d=new Date(iso);if(isNaN(d))return"";return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZoneName:"short"});}
function toLocalInput(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return"";const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function countdown(iso,dateOnly){if(!iso)return"";const ms=new Date(iso)-Date.now();if(isNaN(ms))return"";
  if(dateOnly){const day=x=>{const d=new Date(x);d.setHours(0,0,0,0);return d};const dd=Math.round((day(iso)-day(Date.now()))/864e5);
    if(dd<0)return"";if(dd===0)return"<b>Race day</b> · tonight";if(dd===1)return"Green flag <b>tomorrow</b>";return"Green flag in <b>"+dd+" days</b>";}
  if(ms<=0)return ms>-4*3600e3?"<b>Race day</b> · green flag has dropped":"";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return"Green flag in <b>"+(d?d+"d ":"")+h+"h"+(d?"":" "+m+"m")+"</b>";}
const drv=id=>S.drivers.find(d=>d.id===id);
const carno=d=>d&&d.number!==undefined&&d.number!==null&&String(d.number)!==""?'<span class="carno">#'+esc(d.number)+"</span> ":"";
function dlink(id){const d=drv(id);if(!d)return'<span class="muted">Removed driver</span>';
  return'<button class="dl" data-act="driver" data-arg="'+esc(id)+'">'+carno(d)+esc(d.name)+"</button>";}
function dlabel(d){return(d.number!==undefined&&String(d.number)!==""?"#"+d.number+" ":"")+d.name;}
const posCls=p=>p===1?"p1":p===2?"p2":p===3?"p3":"";
const posBadge=p=>'<span class="pos '+posCls(p)+'">'+(p==null?"–":esc(p))+"</span>";
function sortedRaces(){return[...S.races].sort((a,b)=>(num(a.round,999)-num(b.round,999))||String(a.date||"").localeCompare(String(b.date||"")));}
const raceLabel=r=>"Round "+(r.round!=null&&r.round!==""?r.round:"?")+" · "+(r.track||"Track TBA");
function isDnf(s){return s&&!/^running$/i.test(String(s).trim());}
const root=()=>S.db.doc("league/main");

/* ---------- stats ---------- */
function compute(){
  const st=settings(),P=st.points,races=sortedRaces();
  const done=races.filter(r=>r.status==="complete"&&Array.isArray(r.results)&&r.results.length&&!r.exhibition);
  const D={};S.drivers.forEach(d=>{D[d.id]={driver:d,starts:0,wins:0,top5:0,top10:0,poles:0,led:0,comp:0,inc:0,dnf:0,finSum:0,startSum:0,startN:0,best:null,racePts:0,penPts:0,total:0,log:[],racesLed:0}});
  const ptsFor=(row,maxLed)=>{if(typeof row.pts==="number"&&isFinite(row.pts))return row.pts;const f=int(row.fin);let p=f?num(P.table[f-1],0):0;const led=int(row.lapsLed)||0;
    if(led>0)p+=num(P.ledLap,0);if(maxLed>0&&led===maxLed)p+=num(P.mostLed,0);return p+num(row.bonus,0);};
  done.forEach(r=>{const maxLed=Math.max(0,...r.results.map(x=>int(x.lapsLed)||0));
    r.results.forEach(x=>{const s=D[x.driverId];if(!s)return;const f=int(x.fin),pts=ptsFor(x,maxLed),led=int(x.lapsLed)||0,inc=int(x.inc)||0,start=int(x.start);
      s.starts++;if(f===1)s.wins++;if(f&&f<=5)s.top5++;if(f&&f<=10)s.top10++;if(start===1)s.poles++;
      s.led+=led;if(led>0)s.racesLed++;s.comp+=int(x.lapsComp)||0;s.inc+=inc;if(isDnf(x.status))s.dnf++;
      if(f){s.finSum+=f;if(s.best===null||f<s.best)s.best=f;}if(start){s.startSum+=start;s.startN++;}
      s.racePts+=pts;s.log.push({race:r,fin:f,start,led,inc,status:x.status||"Running",pts,comp:int(x.lapsComp)});});});
  S.penalties.forEach(p=>{const s=D[p.driverId];if(s&&!p.included)s.penPts+=num(p.points,0);});
  Object.values(D).forEach(s=>{s.total=s.racePts-s.penPts;s.avgFin=s.starts?s.finSum/s.starts:null;s.avgStart=s.startN?s.startSum/s.startN:null;});
  const off=S.official&&Array.isArray(S.official.rows)&&S.official.rows.length?S.official:null;
  if(off)off.rows.forEach(o=>{const s=D[o.driverId];if(s){s.off=o;s.total=num(o.pts,0);s.starts=num(o.starts,s.starts);s.wins=num(o.wins,s.wins);s.top5=num(o.t5,s.top5);s.top10=num(o.t10,s.top10);s.poles=num(o.poles,s.poles);s.led=num(o.led,s.led);s.inc=num(o.inc,s.inc);}});
  const standings=Object.values(D).filter(s=>s.starts>0||s.off||s.driver.active!==false)
    .sort(off?((a,b)=>((a.off?a.off.pos:9999)-(b.off?b.off.pos:9999))||String(a.driver.name).localeCompare(String(b.driver.name)))
      :((a,b)=>(b.total-a.total)||(b.wins-a.wins)||((a.best||99)-(b.best||99))||(b.starts-a.starts)||String(a.driver.name).localeCompare(String(b.driver.name))));
  const rank={};let shown=0;standings.forEach(s=>{if(off){if(s.off)rank[s.driver.id]=s.off.pos;}else if(s.starts>0){shown++;rank[s.driver.id]=shown;}});
  const next=races.find(r=>r.status!=="complete")||null;
  const ran=Object.values(D).filter(s=>s.starts>0);
  const by=(f,cmp)=>ran.length?[...ran].sort(cmp||((a,b)=>f(b)-f(a)))[0]:null;
  const winners=new Set();done.forEach(r=>{const w=r.results.find(x=>int(x.fin)===1);if(w)winners.add(w.driverId);});
  const minStarts=Math.max(1,Math.ceil(done.length/2));
  const clean=ran.filter(s=>s.starts>=minStarts).sort((a,b)=>(a.inc/a.starts)-(b.inc/b.starts))[0]||null;
  const totalInc=done.reduce((t,r)=>t+r.results.reduce((u,x)=>u+(int(x.inc)||0),0),0),totalStarts=done.reduce((t,r)=>t+r.results.length,0);
  const league={run:races.filter(r=>r.status==="complete"&&(r.results||[]).length).length,total:races.length,avgDrv:totalStarts?totalInc/totalStarts:0,winners:winners.size,
    mostWins:by(s=>s.wins),mostLed:by(s=>s.led),clean,avgInc:done.length?totalInc/done.length:0};
  return{st,races,done,D,standings,rank,next,league,ptsFor,off};
}

/* ---------- views ---------- */
const V={};
function empty(t,s){return'<div class="empty"><b>'+esc(t)+"</b>"+esc(s||"")+"</div>";}
function loading(){return'<div class="skel"></div><div class="skel" style="height:220px"></div>';}
function notice(){
  if(S.mode==="nodb")return'<div class="notice">Sign in to Claude to see the standings, results and recaps for this league.</div>';
  if(S.mode==="offline")return'<div class="notice">League data could not be loaded. Refresh the page to try again.</div>';
  return"";}

V.home=()=>{const c=S.calc;let h="";
  if(c.next){const r=c.next;
    h+='<section class="hero"><div class="eyebrow">Next up · Round '+esc(r.round!=null&&r.round!==""?r.round:"?")+'</div><h1 class="track">'+esc(r.track||"Track TBA")+'</h1><div class="rule"></div>'+
      (r.name?'<div class="rname">'+esc(r.name)+"</div>":"")+'<div class="meta"><span>'+fmtDate(r.date)+"</span>"+(fmtTime(r.date,r.dateOnly)?"<span>"+fmtTime(r.date,r.dateOnly)+"</span>":"")+(r.laps?"<span>"+esc(r.laps)+" laps</span>":"")+"</div>"+
      (r.note?'<div class="small" style="margin-top:6px;color:var(--accent)">'+esc(r.note)+"</div>":"")+
      (countdown(r.date,r.dateOnly)?'<div class="count">'+countdown(r.date,r.dateOnly)+"</div>":"")+(liveBtn(r)?'<div class="row" style="margin-top:12px">'+liveBtn(r)+"</div>":"")+pastWinnersLine(r.track)+"</section>";}
  else if(!c.races.length){h+='<section class="hero"><div class="eyebrow">'+esc(c.st.season)+' season</div><h1 class="track">Schedule coming soon</h1><div class="rule"></div><div class="muted">Race dates will show here as soon as they are posted.</div></section>';}
  else{const ch=c.standings[0];h+='<section class="hero"><div class="eyebrow">'+esc(c.st.season)+' season complete</div><h1 class="track">'+(ch?esc(ch.driver.name):"Season complete")+'</h1><div class="rule"></div><div class="muted">'+(ch?"Champion with "+ch.total+" points and "+plural(ch.wins,"win"):"")+"</div></section>";}

  const last=c.done[c.done.length-1];let left="";
  if(last){const top=[...last.results].sort((a,b)=>a.fin-b.fin).slice(0,3);
    left+='<div class="panel"><div class="sechead"><div class="lt">Latest result</div><span class="muted small">'+esc(raceLabel(last))+" · "+fmtShort(last.date)+'</span></div><div class="podium">'+
      top.map(x=>{const d=drv(x.driverId);return'<div class="podrow">'+posBadge(x.fin)+'<div class="name">'+dlink(x.driverId)+'<div class="sub">'+(int(x.lapsLed)?esc(x.lapsLed)+" led · ":"")+esc(int(x.inc)||0)+"x</div></div>"+'<span class="pts">'+c.ptsFor(x,Math.max(0,...last.results.map(y=>int(y.lapsLed)||0)))+"</span></div>";}).join("")+
      '</div><div class="row" style="margin-top:12px"><button class="btn sm" data-act="openrace" data-arg="'+esc(last.id)+'">Full results</button>'+(safeUrl(last.recapUrl)?'<a class="btn sm primary" href="'+esc(safeUrl(last.recapUrl))+'" target="_blank" rel="noopener">Watch recap</a>':"")+"</div></div>";}
  else left+='<div class="panel"><div class="lt">Latest result</div>'+empty("No results yet","Results appear here after the first race is posted.")+"</div>";

  const L=c.league;
  left+='<div class="panel"><div class="lt">League stats</div><div class="tiles">'+
    tile(L.run+(L.total?" / "+L.total:""),"Races run")+tile(L.winners,"Different winners")+
    tile(L.mostWins&&L.mostWins.wins?L.mostWins.driver.name:"–","Most wins"+(L.mostWins&&L.mostWins.wins?" ("+L.mostWins.wins+")":""),true)+
    tile(L.mostLed&&L.mostLed.led?L.mostLed.driver.name:"–","Most laps led"+(L.mostLed&&L.mostLed.led?" ("+L.mostLed.led+")":""),true)+
    tile(L.clean?L.clean.driver.name:"–","Cleanest"+(L.clean?" ("+(L.clean.inc/L.clean.starts).toFixed(1)+"x/race)":""),true)+
    tile(L.avgDrv?L.avgDrv.toFixed(1)+"x":"–","Avg incidents per driver")+"</div></div>";

  const top5=c.standings.filter(s=>c.off?s.off:s.starts>0).slice(0,5);const lead=top5[0]?top5[0].total:0;
  let right='<div class="panel"><div class="sechead"><div class="lt">Standings</div><button class="btn sm ghost" data-act="nav" data-arg="standings">All drivers</button></div>'+
    (top5.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Pos</th><th>Driver</th><th class="n">Pts</th><th class="n">Gap</th></tr></thead><tbody>'+
      top5.map((s,i)=>"<tr><td>"+posBadge(c.off?s.off.pos:i+1)+"</td><td>"+dlink(s.driver.id)+'</td><td class="n"><span class="pts">'+fmtN(s.total)+'</span></td><td class="n muted">'+(i?"−"+fmtN(lead-s.total):"Leader")+"</td></tr>").join("")+"</tbody></table></div>"+
      (c.off?'<p class="hint" style="margin:8px 0 0">Official SimRacerHub points after Round '+esc(c.off.afterRound)+".</p>":"")
    :empty("Standings open after race 1",""))+"</div>";
  if(chaseData())right=chasePanel(false);
  right+=powerPanel();
  const withRecap=c.done.filter(r=>safeUrl(r.recapUrl));const lr=withRecap[withRecap.length-1];
  right+='<div class="panel"><div class="lt">Latest recap</div>'+(lr?recapEmbed(lr):empty("No recaps yet","Race recaps will be linked here."))+"</div>";
  right+=linksPanel();
  return h+'<div class="grid2"><div class="stack">'+left+'</div><div class="stack">'+right+"</div></div>";};

function hubBtn(label){const u=safeUrl(settings().hubUrl);return u?'<a class="btn sm" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(label||"Official standings on SimRacerHub")+" ↗</a>":"";}
function hubBar(label){const b=hubBtn(label);return b?'<div class="row" style="margin-bottom:12px">'+b+"</div>":"";}
function tile(v,l,small){return'<div class="tile"><b'+(small?' class="sm"':"")+">"+esc(v)+"</b><span>"+esc(l)+"</span></div>";}
function linksPanel(){const st=settings(),dc=safeUrl(st.discord),sp=safeUrl(st.sponsorUrl),hb=safeUrl(st.hubUrl),yt=safeUrl(st.youtubeUrl),tw=safeUrl(st.liveUrl);if(!dc&&!sp&&!hb&&!yt&&!tw)return"";
  return'<div class="panel"><div class="lt">Links</div><div class="links">'+(tw?'<a class="btn" href="'+esc(tw)+'" target="_blank" rel="noopener">Watch races live</a>':"")+(yt?'<a class="btn" href="'+esc(yt)+'" target="_blank" rel="noopener">Recaps on YouTube</a>':"")+(hb?'<a class="btn" href="'+esc(hb)+'" target="_blank" rel="noopener">SimRacerHub standings</a>':"")+(dc?'<a class="btn primary" href="'+esc(dc)+'" target="_blank" rel="noopener">Join the Discord</a>':"")+(sp?'<a class="btn" href="'+esc(sp)+'" target="_blank" rel="noopener">'+esc(st.sponsorName||"Sponsor")+"</a>":"")+"</div></div>";}
function recapRow(r){const c=S.calc,w=(r.results||[]).find(x=>int(x.fin)===1);
  return'<div class="recap"><a class="play" href="'+esc(safeUrl(r.recapUrl))+'" target="_blank" rel="noopener" aria-label="Watch recap"></a><div style="min-width:0"><div class="racetitle">'+esc(r.track||"Race")+'</div><div class="racesub">Round '+esc(r.round??"?")+" · "+fmtShort(r.date)+(w&&drv(w.driverId)?" · Won by "+esc(drv(w.driverId).name):"")+'</div></div><a class="btn sm" href="'+esc(safeUrl(r.recapUrl))+'" target="_blank" rel="noopener">Watch</a></div>';}

const fmtN=v=>{const n=Number(v);return isFinite(n)?n.toLocaleString("en-US"):esc(v)};
const last5=s=>'<div class="chips">'+s.log.slice(-5).map(l=>'<span class="fchip '+(l.fin===1?"w":l.fin&&l.fin<=5?"t5":"")+(isDnf(l.status)?" dnf":"")+'" title="'+esc(raceLabel(l.race))+'">'+esc(l.fin??"–")+"</span>").join("")+"</div>";
/* ---- sortable tables ---- */
const SORT={std:{key:"pos",dir:"asc"},drv:{key:"rank",dir:"asc"},q:""};
try{const v=JSON.parse(localStorage.getItem("inrs-sort")||"null");if(v&&v.std&&v.drv){SORT.std=v.std;SORT.drv=v.drv;}}catch(e){}
function saveSort(){try{localStorage.setItem("inrs-sort",JSON.stringify({std:SORT.std,drv:SORT.drv}));}catch(e){}}
const carNum=d=>{const v=String(d&&d.number!=null?d.number:"").trim();if(v==="")return 1e9;const n=parseInt(v,10);return isFinite(n)?n+(v.length>String(n).length?-0.5:0):1e9;};
function sortRows(rows,cols,st){const col=cols.find(c=>c.k===st.key)||cols[0],m=st.dir==="desc"?-1:1;
  return[...rows].sort((a,b)=>{const x=col.v(a),y=col.v(b),xn=x==null||x==="",yn=y==null||y==="";
    if(xn&&yn)return 0;if(xn)return 1;if(yn)return-1;
    const r=typeof x==="string"?x.localeCompare(y):x-y;return r*m||((cols[0].v(a)??1e9)-(cols[0].v(b)??1e9));});}
function th(c,st,which){const on=st.key===c.k;const arrow=on?(st.dir==="asc"?" ▲":" ▼"):"";
  return'<th class="'+(c.n?"n ":"")+'sortable"'+(on?' aria-sort="'+(st.dir==="asc"?"ascending":"descending")+'"':"")+'><button class="sortbtn'+(on?" on":"")+'" data-act="sort" data-arg="'+which+":"+c.k+'" title="Sort by '+esc(c.t)+'">'+esc(c.l)+'<span class="arr">'+arrow+"</span></button></th>";}
const cell=(c,s)=>'<td class="'+(c.n?"n":"")+(c.cls?" "+c.cls(s):"")+'">'+c.r(s)+"</td>";

function officialStandings(c){const o=c.off,cut=num(o.chaseCutoff,0),st=SORT.std;

    {k:"num",l:"#",t:"car number",d:"asc",n:1,v:s=>carNum(s.driver),r:s=>'<span class="muted">'+esc(s.driver.number||"–")+"</span>"},

    {k:"starts",l:"Starts",t:"starts",d:"desc",n:1,v:s=>num(R(s).starts,0),r:s=>fmtN(R(s).starts)},

    {k:"t5",l:"T5",t:"top 5s",d:"desc",n:1,v:s=>num(R(s).t5,0),r:s=>fmtN(R(s).t5)},
    {k:"t10",l:"T10",t:"top 10s",d:"desc",n:1,v:s=>num(R(s).t10,0),r:s=>fmtN(R(s).t10)},
    {k:"poles",l:"Poles",t:"poles",d:"desc",n:1,v:s=>num(R(s).poles,0),r:s=>fmtN(R(s).poles)},
    {k:"led",l:"Led",t:"laps led",d:"desc",n:1,v:s=>num(R(s).led,0),r:s=>fmtN(R(s).led)},
    {k:"stg",l:"Stage pts",t:"stage points",d:"desc",n:1,v:s=>num(R(s).stgPts,0),r:s=>fmtN(R(s).stgPts)},
    {k:"pen",l:"Pen",t:"penalty points",d:"asc",n:1,v:s=>num(R(s).penPts,0),r:s=>R(s).penPts?fmtN(R(s).penPts):"0",cls:s=>R(s).penPts?"":"muted"},
    {k:"avgfin",l:"Avg fin",t:"average finish",d:"asc",n:1,v:s=>s.avgFin,r:s=>s.avgFin?s.avgFin.toFixed(1):"–"},
    {k:"inc",l:"Inc/race",t:"incidents per race",d:"asc",n:1,v:s=>R(s).incPerRace!=null?Number(R(s).incPerRace):null,r:s=>R(s).incPerRace!=null?Number(R(s).incPerRace).toFixed(2):"–"},
    {k:"rating",l:"Rating",t:"average driver rating",d:"desc",n:1,v:s=>R(s).rating!=null?Number(R(s).rating):null,r:s=>R(s).rating!=null?Number(R(s).rating).toFixed(1):"–"},
    {k:"team",l:"Team",t:"team",d:"asc",v:s=>String(R(s).team||"").toLowerCase()||null,r:s=>esc(R(s).team||""),cls:()=>"muted small"}];
  S.stdCols=cols;
  const rows=sortRows(c.standings.filter(R),cols,st),showCut=cut&&st.key==="pos"&&st.dir==="asc";
  const n=cols.length+1;
  return'<section><div class="sechead"><div class="lt">Championship standings</div><span class="hint">Official SimRacerHub points after Round '+esc(o.afterRound)+(o.asOf?" · updated "+esc(fmtShort(o.asOf+"T12:00:00")):"")+"</span></div>"+hubBar()+
    '<div class="row" style="margin-bottom:8px"><span class="hint">Tap a column heading to sort. Tap again to reverse.</span>'+(st.key!=="pos"||st.dir!=="asc"?'<button class="btn sm ghost" data-act="sortreset" data-arg="std">Reset to points order</button>':"")+"</div>"+

    rows.map(s=>(showCut&&R(s).pos===cut+1?'<tr><td colspan="'+n+'" style="padding:4px 8px;border-bottom:2px solid var(--accent);font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)">Chase cutoff · top '+cut+"</td></tr>":"")+
      "<tr>"+cols.slice(0,cols.length-1).map(cc=>cell(cc,s)).join("")+"<td>"+last5(s)+"</td>"+cell(cols[cols.length-1],s)+"</tr>").join("")+
    '</tbody></table></div></div><p class="hint">Points include stage points, bonuses, penalties, drop races and the Chase reset, exactly as SimRacerHub scores them.</p></section>';}

const stdDrivers=()=>{const c=S.calc;if(c.off)return officialStandings(c);const base=c.standings.filter(s=>s.starts>0);
  if(!base.length)return'<div class="lt">Championship standings</div>'+hubBar()+empty("No races run yet","Standings appear after the first results are posted.");

    '<div class="panel" style="padding:6px 8px"><div class="scroll"><table class="tbl"><thead><tr>'+cols.map(cc=>th(cc,st,"std")).join("")+"<th>Last 5</th></tr></thead><tbody>"+
    rows.map(s=>"<tr>"+cols.map(cc=>cell(cc,s)).join("")+"<td>"+last5(s)+"</td></tr>").join("")+
    '</tbody></table></div></div><p class="hint">'+pointsSummary()+"</p></section>";};

function pointsSummary(){const P=settings().points,t=P.table;let lastI=t.length-1;while(lastI>0&&!num(t[lastI],0))lastI--;
  return"Points: 1st "+num(t[0],0)+(t[1]!==undefined?", 2nd "+num(t[1],0):"")+(t[2]!==undefined?", 3rd "+num(t[2],0):"")+(lastI>2?" … down to "+num(t[lastI],0)+" for "+(lastI+1)+"th":"")+
    (num(P.ledLap,0)?". +"+num(P.ledLap,0)+" for leading a lap":"")+(num(P.mostLed,0)?", +"+num(P.mostLed,0)+" for most laps led":"")+". Penalty points come off the total.";}

function resultsTable(r){const maxLed=Math.max(0,...r.results.map(x=>int(x.lapsLed)||0));const hasStage=r.results.some(x=>num(x.stage,0)),hasRating=r.results.some(x=>x.rating!=null);

V.schedule=()=>{const c=S.calc;if(!c.races.length)return'<div class="lt">'+esc(c.st.season)+" schedule</div>"+hubBar("League page on SimRacerHub")+empty("No races scheduled yet","The league admin adds races from the Admin tab.");

      ('<div class="raceactions">'+(done?'<button class="btn sm" data-act="race" data-arg="'+esc(r.id)+'" aria-expanded="'+open+'">'+(open?"Hide results":"Results")+"</button>":"")+(rec?'<a class="btn sm primary" href="'+esc(rec)+'" target="_blank" rel="noopener">Watch recap</a>':"")+'<button class="btn sm ghost" data-act="track" data-arg="'+esc(trackOf(r.track).key)+'">Track history</button>'+(isNext?liveBtn(r):"")+"</div>")+
      (open&&done?'<div class="racebody">'+resultsTable(r)+"</div>":"")+"</article>";}).join("")+"</div></section>";};

V.drivers=()=>{const c=S.calc;if(S.driverSel&&c.D[S.driverSel])return driverDetail(c.D[S.driverSel]);
  if(!S.drivers.length)return'<div class="lt">Drivers</div>'+empty("No drivers yet","Drivers are added by the admin or from an uploaded results file.");

function driverDetail(s){const c=S.calc,d=s.driver,rk=c.rank[d.id],pens=S.penalties.filter(p=>p.driverId===d.id);

  const o=s.off;
  h+='<div class="tiles">'+tile(fmtN(s.total),"Points")+tile(s.starts,"Starts")+tile(s.wins,"Wins")+tile(s.top5,"Top 5s")+tile(s.top10,"Top 10s")+(o&&o.podiums!=null?tile(o.podiums,"Podiums"):"")+tile(s.poles,"Poles")+tile(s.led,"Laps led")+(o?tile(o.stgPts,"Stage pts")+tile(o.stgWins,"Stage wins"):"")+tile(s.avgFin?s.avgFin.toFixed(1):"–","Avg finish")+tile(s.avgStart?s.avgStart.toFixed(1):"–","Avg start")+tile(s.best??"–","Best finish")+tile(s.inc+"x","Incidents")+tile(s.starts?(s.inc/s.starts).toFixed(1)+"x":"–","Inc per race")+tile(s.dnf,"DNFs")+(o&&o.rating!=null?tile(Number(o.rating).toFixed(1),"Avg rating"):"")+
    (o?(num(o.penPts,0)?tile(fmtN(o.penPts),"Penalty pts"):""):(s.penPts?tile("−"+s.penPts,"Penalty pts"):""))+"</div>";

const TRACKS=[[/Raceway Park/i,"irp","Lucas Oil Raceway (IRP)"],[/Milwaukee/i,"milwaukee","Milwaukee Mile"],[/Rockingham/i,"rockingham","Rockingham"],[/Lime Rock/i,"lime-rock","Lime Rock"],[/Portland/i,"portland","Portland"],[/Gilles Villeneuve/i,"montreal","Montreal"],[/Daytona/i,"daytona","Daytona"],[/Charlotte.*Roval/i,"charlotte-roval","Charlotte Roval"],[/Charlotte/i,"charlotte","Charlotte"],[/Gateway|World Wide Technology/i,"gateway","Gateway"],
 [/Sonoma/i,"sonoma","Sonoma"],[/Nashville/i,"nashville","Nashville"],[/Road America/i,"road-america","Road America"],[/Atlanta/i,"atlanta","Atlanta"],[/New Hampshire/i,"new-hampshire","New Hampshire"],
 [/Pocono/i,"pocono","Pocono"],[/Indianapolis.*Road/i,"indy-road","Indianapolis Road Course"],[/Indianapolis/i,"indianapolis","Indianapolis"],[/Michigan/i,"michigan","Michigan"],[/Richmond/i,"richmond","Richmond"],
 [/Watkins Glen/i,"watkins-glen","Watkins Glen"],[/Darlington/i,"darlington","Darlington"],[/Kansas/i,"kansas","Kansas"],[/Bristol.*Dirt/i,"bristol-dirt","Bristol Dirt"],[/Bristol/i,"bristol","Bristol"],
 [/Texas/i,"texas","Texas"],[/Talladega/i,"talladega","Talladega"],[/Las Vegas/i,"las-vegas","Las Vegas"],[/Homestead/i,"homestead","Homestead-Miami"],[/Martinsville/i,"martinsville","Martinsville"],
 [/Phoenix/i,"phoenix","Phoenix"],[/Coliseum/i,"la-coliseum","LA Coliseum"],[/Auto Club/i,"auto-club","Auto Club"],[/Circuit of the Americas/i,"cota","COTA"],[/Dover/i,"dover","Dover"],
 [/North Wilkesboro/i,"north-wilkesboro","North Wilkesboro"],[/Chicago Street/i,"chicago-street","Chicago Street Course"],[/Chicagoland/i,"chicagoland","Chicagoland"],[/Iowa/i,"iowa","Iowa"],[/Coronado|San Diego/i,"san-diego","San Diego Street Course"]];
function trackOf(name){const s=String(name||"");for(const[re,k,l]of TRACKS)if(re.test(s))return{key:k,label:l};const l=s.replace(/\[Retired\]\s*/g,"").trim()||"Unknown";return{key:l.toLowerCase().replace(/[^a-z0-9]+/g,"-"),label:l};}
function buildTracks(){const T={};const add=(name,o)=>{const t=trackOf(name);(T[t.key]=T[t.key]||{key:t.key,label:t.label,races:[]}).races.push(o);return t.key;};
  (S.history||[]).forEach(h=>add(h[4],{season:+h[0],round:h[1],date:h[2],event:h[3],pole:h[5],winner:h[6]}));
  const season=+settings().season||new Date().getFullYear();
  sortedRaces().forEach(r=>{const res=r.results||[],w=res.find(x=>int(x.fin)===1),p=res.find(x=>int(x.start)===1);
    add(r.track,{season,round:r.round,date:fmtShort(r.date),event:r.name||"",pole:p&&drv(p.driverId)?drv(p.driverId).name:"",winner:w&&drv(w.driverId)?drv(w.driverId).name:"",raceId:r.id,current:true,done:r.status==="complete"&&res.length,exhibition:!!r.exhibition});});
  Object.values(T).forEach(t=>{t.races.sort((a,b)=>b.season-a.season||(int(b.round)||0)-(int(a.round)||0));
    const wins={};t.races.forEach(r=>{if(r.winner&&!r.exhibition)wins[r.winner]=(wins[r.winner]||0)+1;});t.wins=Object.entries(wins).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    t.onSchedule=t.races.some(r=>r.current);t.next=t.races.filter(r=>r.current&&!r.done).sort((a,b)=>(int(a.round)||0)-(int(b.round)||0))[0]||null;});
  return T;}
function mostWins(t){if(!t.wins.length)return null;const top=t.wins[0][1],tied=t.wins.filter(w=>w[1]===top);
  const who=tied.length===1?tied[0][0]:top===1?"Multiple drivers tied":tied.length===2?tied[0][0]+" & "+tied[1][0]:tied.length+" drivers tied";
  return{who,n:top,tied:tied.length>1,detail:top===1&&tied.length>1?"1 win each":tied.length>1?top+" wins each":plural(top,"win")};}
function pastWinnersLine(trackName){const T=buildTracks(),t=T[trackOf(trackName).key];if(!t)return"";
  const past=t.races.filter(r=>r.winner&&!r.exhibition).slice(0,4);if(!past.length)return"";
  return'<div class="pastw"><span class="muted">Past winners here:</span> '+past.map(r=>"<b>"+esc(r.winner)+'</b> <span class="muted">'+r.season+"</span>").join(" · ")+' <button class="btn sm ghost" data-act="track" data-arg="'+esc(t.key)+'">Track history</button></div>';}
V.tracks=()=>{const T=buildTracks();if(S.trackSel&&T[S.trackSel])return trackDetail(T[S.trackSel]);

      (lw?'<span class="small">Last winner: <b>'+esc(lw.winner)+'</b> <span class="muted">'+lw.season+"</span></span>":"")+(mw&&(mw.n>1||mw.tied)?'<span class="small muted">Most wins: '+esc(mw.who)+" ("+mw.detail+")</span>":"")+"</button>";};
  const on=list.filter(t=>t.onSchedule),off=list.filter(t=>!t.onSchedule);
  return'<section class="stack"><div><div class="lt">'+esc(settings().season)+' tracks</div><div class="dgrid">'+on.map(card).join("")+"</div></div>"+(off.length?'<div><div class="lt">Past tracks</div><div class="dgrid">'+off.map(card).join("")+"</div></div>":"")+
    '<p class="hint">History covers '+esc(settings().name)+' races on SimRacerHub'+(()=>{const y=(S.history||[]).map(h=>+h[0]).concat([+settings().season]).filter(Boolean);return y.length?" since "+Math.min(...y):"";})()+'.</p></section>';};

/* ---------- careers & records (all series, all seasons) ---------- */
const SER_L={cup:"Cup",xfinity:"Xfinity",trucks:"Trucks"};
function mainLines(){const M=S.M,o=M.official;if(!o||!Array.isArray(o.rows))return[];const fin={};

  return o.rows.map(r=>{const d=D[r.driverId]||{name:r.driverId},f=fin[r.driverId]||[0,0];
    return[r.driverId,d.name,d.number||"",r.pos,r.pts,num(r.starts),num(r.wins),num(r.t5),num(r.t10),num(r.poles),num(r.led),num(r.inc),f[0],f[1],r.team||""];});}

function careers(series){const C={};

    c.seasons.push(l);const yr=+l.si.year;if(yr>=c.last){c.last=yr;c.name=l.name;if(String(l.number||"")!=="")c.number=l.number;}

  if(P2){const lead=L.pts-P2.pts,need=(R-1)*M-lead+1,P2n=P2.s.driver.name;let t;
    if(R===1)t="Wins the title at "+nt+" unless "+esc(P2n)+" outscores "+esc(Ln)+" by more than "+lead+" (a tie goes to the tiebreaker).";

function clientId(){const B=book();if(!B.cid){B.cid="c"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);saveBook();}return B.cid;}
async function pollMarket(){const u=liveDb();if(!u||document.hidden||(S.view!=="odds"&&!S.slipOpen))return;const r=S.calc&&S.calc.next;if(!r)return;const mk=mkey(S.sel,r.id);
  try{const res=await fetch(u+"/market/"+mk+".json",{cache:"no-store"});if(!res.ok)return;const j=(await res.json())||{},cnt={};
    Object.entries(j).forEach(([sel,v])=>{cnt[sel]=Object.keys(v||{}).length;});const sig=JSON.stringify(cnt);
    if(sig!==S.marketSig[mk]){S.marketSig[mk]=sig;S.market[mk]=cnt;render();}}catch(e){}}

const popCount=(k,rid,did,m)=>((S.market[mkey(k,rid)]||{})[skey(did,m)])||0;
const marketMult=n=>n>=3?Math.min(1.5,1+0.08*(n-2)):1;
function priceOf(d,x,mm){const n=popCount(S.sel,d.race.id,x.id,mm);return oddsFmt(x[{win:"pWin",top5:"p5",top10:"p10"}[mm]]*marketMult(n),{win:d.VIG,top5:1.12,top10:1.08}[mm]);}
function recordMarket(bets){const u=liveDb();if(!u)return;const cid=clientId(),seen=new Set();
  bets.forEach(b=>b.legs.forEach(l=>{const key=mkey(l.k,l.rid)+"/"+skey(l.did,l.m);if(seen.has(key))return;seen.add(key);
    fetch(u+"/market/"+key+"/"+cid+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:"true"}).catch(()=>{});}));
  setTimeout(pollMarket,1500);}

function finishChart(series){const races=sortedRaces().filter(r=>!r.exhibition&&r.status==="complete"&&(r.results||[]).length);if(!races.length)return"";
  const W=760,H=240,L=34,R=12,T=14,B=28,maxF=Math.max(10,...series.flatMap(s=>s.pts.map(p=>p.fin||0)));const ymax=Math.ceil(maxF/5)*5;
  const x=i=>L+(races.length===1?0:i*(W-L-R)/(races.length-1)),y=f=>T+(f-1)*(H-T-B)/(ymax-1);
  let g="";[1,5,10,20,30,40].filter(v=>v<=ymax).forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="cg"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="ct">'+v+"</text>";});
  races.forEach((r,i)=>{if(i%5===0||i===races.length-1)g+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" class="ct">'+esc(r.round)+"</text>";});
  series.forEach((s,si)=>{const pts=races.map((r,i)=>{const p=s.pts.find(q=>q.raceId===r.id);return p&&p.fin?{i,fin:p.fin,r}:null;});
    let d="",pen=false;pts.forEach(p=>{if(!p){pen=false;return;}d+=(pen?"L":"M")+x(p.i).toFixed(1)+" "+y(p.fin).toFixed(1)+" ";pen=true;});
    g+='<path d="'+d+'" class="cl" style="stroke:'+s.color+'"/>';
    pts.forEach(p=>{if(!p)return;const win=p.fin===1;g+='<circle cx="'+x(p.i).toFixed(1)+'" cy="'+y(p.fin).toFixed(1)+'" r="'+(win?5:3.2)+'" style="fill:'+(win?"var(--gold)":s.color)+'"><title>'+esc(s.name+": P"+p.fin+" · "+raceLabel(p.r))+"</title></circle>";});});
  return'<div class="chartwrap"><svg viewBox="0 0 '+W+" "+H+'" class="chart" role="img" aria-label="Finishing position by round">'+g+'</svg>'+
    (series.length>1?'<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+"</span>").join("")+"</div>":"")+'<div class="hint" style="margin-top:4px">Finishing position (1 at the top) for each round. Gold dots are wins.</div></div>';}

/* ---------- CSV import ---------- */
function parseCSV(text){const rows=[];let row=[],cell="",q=false;text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell="";}
    else cell+=ch;}
  if(cell!==""||row.length){row.push(cell);rows.push(row);}return rows.map(r=>r.map(c=>c.trim()));}
function importIracing(text){const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r.some(c=>/^fin\s*pos$/i.test(c))&&r.some(c=>/^name$/i.test(c)));
  if(hi<0)throw new Error("This file doesn't look like an iRacing results export. Look for the Fin Pos and Name columns.");
  const H=rows[hi].map(c=>c.toLowerCase().replace(/[^a-z#]/g,""));const col=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i;}return-1;};
  const ix={fin:col("finpos"),name:col("name"),cust:col("custid"),start:col("startpos"),car:col("car#","carnumber","carno"),out:col("out"),led:col("lapsled"),comp:col("lapscomp","lapscompleted"),inc:col("inc","incidents")};
  const body=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r.length||r.every(c=>!c))break;if(!/^\d+$/.test(r[ix.fin]||""))continue;body.push(r);}
  if(!body.length)throw new Error("No finishing rows were found in this file.");
  const g=(r,k)=>ix[k]>=0?(r[ix[k]]||""):"";
  const finBase=Math.min(...body.map(r=>int(g(r,"fin"))))===0?1:0;
  const starts=body.map(r=>int(g(r,"start"))).filter(x=>x!==null);const startBase=starts.length&&Math.min(...starts)===0?1:0;
  let fresh=0;
  const out=body.map(r=>{const cust=g(r,"cust"),name=g(r,"name"),car=g(r,"car").replace(/^#/,"");
    let d=cust?S.drivers.find(x=>String(x.custId||"")===cust):null;if(!d)d=S.drivers.find(x=>String(x.name||"").toLowerCase()===name.toLowerCase());
    if(!d)fresh++;const st=int(g(r,"start")),o=g(r,"out");
    return{driverId:d?d.id:"__new",newName:d?"":name,newNumber:d?"":car,newCust:d?"":cust,fin:String(int(g(r,"fin"))+finBase),start:st===null?"":String(st+startBase),led:String(int(g(r,"led"))||0),comp:g(r,"comp"),inc:String(int(g(r,"inc"))||0),status:!o||/running/i.test(o)?"Running":o,bonus:"0"};});
  return{rows:out,fresh};}

function findDriver(q){const v=String(q||"").trim().toLowerCase();if(!v)return null;const L=S.cmpAll||S.drivers;
  const ex=L.find(d=>dlabel(d).toLowerCase()===v);if(ex)return ex;
  const n=v.replace(/^#/,"");if(/^\d+$/.test(n)){const m=L.filter(d=>String(d.number)===n);if(m.length===1)return m[0];}
  const m=L.filter(d=>String(d.name).toLowerCase().includes(v.replace(/^#\d+\s*/,"")));return m.length===1?m[0]:null;}
function pickCmp(el,final){const d=findDriver(el.value);const i=el.dataset.cmp==="a"?0:1;

  if(final){toast("No single driver matches \""+el.value+"\". Try more of the name or the full car number.",true);draw();}}
/* head-to-head driver picker */
function cmpMatches(q){const L=S.cmpAll||[],v=String(q||"").trim().toLowerCase().replace(/^#/,"");if(!v)return L;
  return L.filter(d=>String(d.number)===v||String(d.number).startsWith(v)&&/^\d+$/.test(v)||String(d.name).toLowerCase().includes(v)||dlabel(d).toLowerCase().includes(v));}
function cmpOpen(el,q){const pop=document.getElementById("cmp-pop-"+el.dataset.cmp);if(!pop)return;const i=el.dataset.cmp==="a"?0:1,cur=S.cmp&&S.cmp[i],other=S.cmp&&S.cmp[1-i];
  const L=cmpMatches(q),rk=S.calc?S.calc.rank:{};
  pop.innerHTML=L.length?L.map(d=>'<button type="button" class="opt'+(d.id===cur?" cur":"")+(d.id===other?" dis":"")+'" role="option" tabindex="-1" data-pick="'+esc(d.id)+'"'+(d.id===cur?' aria-selected="true"':"")+">"+carno(d)+esc(d.name)+(rk[d.id]?"<small>P"+rk[d.id]+"</small>":"")+"</button>").join(""):'<div class="none">No driver matches "'+esc(q)+'"</div>';
  pop.hidden=false;el.setAttribute("aria-expanded","true");pop.dataset.ai="-1";
  const c=pop.querySelector(".opt.cur");if(c&&!q)pop.scrollTop=c.offsetTop-pop.clientHeight/2+c.offsetHeight/2;}
function cmpClose(el){const pop=el&&document.getElementById("cmp-pop-"+el.dataset.cmp);if(pop){pop.hidden=true;pop.innerHTML="";}if(el)el.setAttribute("aria-expanded","false");}
function cmpChoose(which,id){const i=which==="a"?0:1,d=(S.cmpAll||[]).find(x=>x.id===id);if(!d)return;
  const el=document.getElementById("cmp-"+which);if(el){cmpClose(el);el.blur();}
  if(S.cmp&&S.cmp[1-i]===id){toast(d.name+" is already on the other side. Pick a different driver.",true);draw();return;}
  S.cmp=S.cmp||[];S.cmp[i]=id;S.pending=false;draw();}
document.addEventListener("focusin",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp){try{el.select();}catch(_){}cmpOpen(el,"");}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp)cmpOpen(el,el.value);});
document.addEventListener("mousedown",e=>{if(e.target.closest&&e.target.closest(".pop"))e.preventDefault();});
document.addEventListener("click",e=>{const o=e.target.closest&&e.target.closest("[data-pick]");if(!o)return;const pop=o.closest(".pop");cmpChoose(pop.id.slice(-1),o.dataset.pick);});
document.addEventListener("focusout",e=>{const el=e.target;if(el.dataset&&el.dataset.cmp)setTimeout(()=>{if(document.activeElement===el)return;cmpClose(el);const ae=document.activeElement;if(ae&&ae.dataset&&ae.dataset.cmp){const i=el.dataset.cmp==="a"?0:1,d=(S.cmpAll||[]).find(x=>S.cmp&&x.id===S.cmp[i]);if(d)el.value=dlabel(d);}else draw();},120);});
document.addEventListener("keydown",e=>{const el=e.target;if(!(el.dataset&&el.dataset.cmp))return;const pop=document.getElementById("cmp-pop-"+el.dataset.cmp);if(!pop)return;
  const opts=[...pop.querySelectorAll(".opt")];let a=+pop.dataset.ai;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(pop.hidden)cmpOpen(el,"");if(!opts.length)return;a=e.key==="ArrowDown"?Math.min(opts.length-1,a+1):Math.max(0,a-1);
    opts.forEach((o,k)=>o.classList.toggle("act",k===a));pop.dataset.ai=a;opts[a].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){e.preventDefault();if(a>=0&&opts[a])cmpChoose(el.dataset.cmp,opts[a].dataset.pick);else if(opts.length===1)cmpChoose(el.dataset.cmp,opts[0].dataset.pick);else pickCmp(el,true);}
  else if(e.key==="Escape"){cmpClose(el);el.blur();}});
document.addEventListener("input",e=>{if(e.target.id!=="dsearch")return;SORT.q=e.target.value;const pos=e.target.selectionStart;draw();const el=document.getElementById("dsearch");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}});
document.addEventListener("change",e=>{const el=e.target,p=el.dataset&&el.dataset.f;if(p)setPath(S.forms,p,el.value);const c=el.dataset&&el.dataset.change;if(c&&CHANGE[c])CHANGE[c](el);});

/* ---------- render ---------- */
function isTyping(){const a=document.activeElement;return!!(a&&a.closest&&a.closest("#main")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file");}
function render(){if(isTyping()){S.pending=true;return;}draw();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!isTyping()){S.pending=false;draw();}},0));
/* visitor counting (website only; GoatCounter, no cookies). Each tab + season counts as a page. */
let gcLast=null;
function gcTrack(){try{const g=window.goatcounter;if(!S.static||!g||typeof g.count!=="function")return;
  const key="/"+S.view+(isMain()?"":"/"+S.sel);if(key===gcLast)return;gcLast=key;
  const tab=(TABS.find(t=>t[0]===S.view)||[0,S.view==="career"?"Career":S.view==="compare"?"Head to head":S.view])[1];
  g.count({path:key,title:tab+(isMain()?"":" · "+S.sel)});}catch(e){}}
window.__gcReady=()=>{gcLast=null;gcTrack();};
function draw(){S.calc=compute();const st=S.calc.st,parts=String(st.name||DEF.name).trim().split(/\s+/);
  document.getElementById("mark").textContent=parts[0];document.getElementById("series").textContent=parts.slice(1).join(" ");document.getElementById("season").textContent=st.season||"";
  document.getElementById("tabs").innerHTML=TABS.filter(t=>t[0]!=="admin"||(S.admin&&isMain())).map(t=>'<button class="tab" data-act="nav" data-arg="'+t[0]+'"'+(S.view===t[0]||(S.view==="career"&&t[0]==="records")||(S.view==="compare"&&t[0]==="drivers")||(S.view==="bets"&&t[0]==="odds")?' aria-current="page"':"")+">"+t[1]+"</button>").join("");
  if(S.view==="admin"&&!S.admin&&S.mode!=="loading")S.view="home";
  const sw=document.getElementById("switch");if(sw){const h=switcher();sw.hidden=!h;if(!isTyping()||!sw.contains(document.activeElement))sw.innerHTML=h;}
  const body=(S.mode==="live"&&!S.loaded)||S.mode==="loading"||S.selLoading?loading():(V[S.view]||V.home)();
  document.getElementById("main").innerHTML=notice()+(S.view==="bets"?"":archBar())+body;drawSlip();if(S.loaded&&!S.selLoading)gcTrack();
  const dc=safeUrl(st.discord),sp=safeUrl(st.sponsorUrl);
  document.getElementById("foot").innerHTML='<span class="presented">Presented by <b>'+esc(st.sponsorName||"40XLI")+"</b></span>"+(dc?'<a class="btn sm ghost" href="'+esc(dc)+'" target="_blank" rel="noopener">Discord</a>':"")+(sp?'<a class="btn sm ghost" href="'+esc(sp)+'" target="_blank" rel="noopener">'+esc(st.sponsorName||"Sponsor")+"</a>":"");}

function markReady(k){S.ready[k]=true;S.loaded=S.ready.s&&S.ready.d&&S.ready.r&&S.ready.p&&S.ready.o;render();}
function onErr(e){if(e&&e.code==="revoked"){S.mode="nodb";}render();}
async function loadStatic(){try{const r=await fetch("data.json",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
  S.static=true;Object.assign(S.M,{history:d.history||[],settingsRaw:d.settings||null,drivers:d.drivers||[],races:d.races||[],penalties:d.penalties||[],official:d.official||null});applySel();
  S.mode="live";S.admin=false;S.loaded=true;S.updated=d.updated||"";}catch(e){S.mode="offline";}draw();}
async function loadIndex(){try{const r=await fetch("data/seasons.json",{cache:"no-store"});if(!r.ok)return;S.idx=await r.json();draw();}catch(e){}}
window.addEventListener("hashchange",()=>{const hs=(location.hash||"").slice(1).split("/"),v=hs[0],k=hs[1]||MAINKEY;
  if((TABS.some(t=>t[0]===v)||v==="compare"||v==="career"||v==="bets")&&v!==S.view){S.view=v;S.driverSel=null;S.trackSel=null;}
  if(k!==S.sel)selectSeason(k);else draw();});
async function boot(){const hs=(location.hash||"").slice(1).split("/"),h=hs[0];if(TABS.some(t=>t[0]===h)||h==="compare"||h==="career"||h==="bets")S.view=h;draw();
  loadIndex().then(()=>{if(hs[1]&&hs[1]!==MAINKEY)selectSeason(hs[1]);});
  const c=window.claude;if(!c||typeof c.use!=="function"){await loadStatic();return;}
  const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
  try{S.admin=user?await user.canEdit():false;}catch(e){S.admin=false;}
  if(!db){S.mode="nodb";draw();return;}
  S.db=db;S.mode="live";const r=root();
  r.onSnapshot(s=>{S.M.settingsRaw=s.exists?s.data():null;applySel();markReady("s");},onErr);
  r.collection("drivers").onSnapshot(q=>{S.M.drivers=q.docs.map(d=>Object.assign({id:d.id},d.data()));applySel();markReady("d");},onErr);
  r.collection("races").onSnapshot(q=>{S.M.races=q.docs.map(d=>Object.assign({id:d.id},d.data()));applySel();markReady("r");},onErr);
  r.collection("penalties").onSnapshot(q=>{S.M.penalties=q.docs.map(d=>Object.assign({id:d.id},d.data()));applySel();markReady("p");},onErr);
  r.collection("official").doc("standings").onSnapshot(s=>{S.M.official=s.exists?s.data():null;applySel();markReady("o");},onErr);
  r.collection("history").doc("all").onSnapshot(s=>{const v=s.exists?s.data():null;S.M.history=v&&Array.isArray(v.rows)?v.rows:[];applySel();render();},()=>{});
  draw();}
setInterval(()=>{if(S.view==="home"&&S.loaded)render();},60000);
boot();
})();
</script>
